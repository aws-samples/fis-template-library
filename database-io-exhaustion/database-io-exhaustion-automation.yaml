    nextStep: CleanupInfrastructureOnCancel
    inputs:
      DocumentName: 'AWS-RunShellScript'
      InstanceIds:
        - '{{ LaunchLoadGenerator.InstanceId }}'
      TimeoutSeconds: 30
      Parameters:
        executionTimeout: '40'
        commands:
        - |
          #!/bin/bash
          # Run this run's own cleanup script, which ExhaustDatabaseIO wrote before it started the load.
          BASE=/var/lib/fis-database-io-exhaustion
          RUN_DIR="$BASE/{{ automation:EXECUTION_ID }}"
          if [ ! -f "$RUN_DIR/cleanup.sh" ]; then
              echo "No cleanup script in $RUN_DIR: the load never started on this instance, so there is nothing to stop or drop."
              exit 0
          fi
          for f in "$BASE" "$RUN_DIR" "$RUN_DIR/cleanup.sh"; do
              if [ -L "$f" ] || [ "$(stat -c '%u' "$f")" != "0" ] || [ $(( 0$(stat -c '%a' "$f") & 077 )) -ne 0 ]; then
                  echo "ERROR: $f is not owned by root and private to it; not running it."
                  exit 1
              fi
          done
          exec bash "$RUN_DIR/cleanup.sh" 2 25 30

  - name: CleanupInfrastructureOnCancel
    # Stop path: the same cleanup, held to 60 s.
    action: 'aws:executeScript'
    timeoutSeconds: 60
    isCritical: true
    onFailure: 'Abort'
    onCancel: 'Abort'
    isEnd: true
    inputs:
      Runtime: python3.11
      Handler: cleanup_infrastructure
      Script: |
        import re
        import time
        import boto3
        from botocore.config import Config
        from botocore.exceptions import ClientError

        def cleanup_infrastructure(events, context):
            # CleanupInfrastructure's script without its comments, with shorter EC2 bounds.
            xid = events['ExecutionId']
            db_sg = events['DatabaseSecurityGroupId']
            port = int(events['DatabasePort'])
            start = time.time()
            deadline = start + int(events['DeadlineSeconds'])
            tables = 'fis_io_' + (re.sub('[^0-9a-zA-Z]', '', xid)[-8:].lower() or 'default') + '_*'
            # Each call gives up within about 11 s (2 attempts of 2 s connect and 3 s read, and backoff), so one
            # started 8 s before the 50 s deadline still ends before the step's 60 s.
            ec2 = boto3.client('ec2', config=Config(connect_timeout=2, read_timeout=3,
                                                    retries={'total_max_attempts': 2, 'mode': 'standard'}))
            sg_filter = [{'Name': 'vpc-id', 'Values': [events['VpcId']]},
                         {'Name': 'group-name', 'Values': ['FIS-DatabaseIO-LoadGen-' + xid]}]
            problems, done, asked, listed, seen, deleted = {}, [], set(), [], set(), set()

            def code(e):
                return e.response.get('Error', {}).get('Code', '') if isinstance(e, ClientError) else ''

            def late(what):
                if time.time() > deadline - 8:
                    problems[what] = what + ': not done before the deadline'
                    return True

            def attempt(what, fn):
                if late(what):
                    return None
                try:
                    r = fn()
                except Exception as e:
                    problems[what] = what + ': ' + str(e)
                    return None
                problems.pop(what, None)
                return r

            def list_groups():
                pages = ec2.get_paginator('describe_security_groups').paginate(Filters=sg_filter)
                listed[:] = [g['GroupId'] for p in pages for g in p['SecurityGroups']]
                seen.update(listed)
                return list(listed)

            def sweep():
                if time.time() > deadline - 8:
                    return None
                try:
                    pages = list(ec2.get_paginator('describe_instances').paginate(
                        Filters=[{'Name': 'client-token', 'Values': [xid]}]))
                except Exception as e:
                    known['err'] = str(e)
                    return None
                found = [i['InstanceId'] for p in pages for r in p['Reservations'] for i in r['Instances']
                         if i['State']['Name'] != 'terminated']
                known.update(err=None, pending=found)
                new = [i for i in found if i not in asked]
                if new and time.time() <= deadline - 8:
                    try:
                        ec2.terminate_instances(InstanceIds=new)
                        asked.update(new)
                        known['term'] = None
                        done.append('terminating ' + ', '.join(new))
                    except Exception as e:
                        known['term'] = 'terminating ' + ', '.join(new) + ': ' + str(e)
                return found

            known = {'err': 'not listed', 'pending': [], 'term': None}
            pending = sweep()
            groups = attempt('listing the security group', list_groups) or []

            def referencing(gids):
                sgs = ec2.describe_security_groups(GroupIds=[db_sg])['SecurityGroups']
                return sorted(set(p.get('GroupId') for sg in sgs for perm in sg.get('IpPermissions', [])
                                  for p in perm.get('UserIdGroupPairs', []) if p.get('GroupId') in gids))

            def restore(gids):
                refs = attempt('reading ' + db_sg, lambda: referencing(gids))
                for gid in refs or []:
                    what = 'revoking ingress from ' + gid + ' on ' + db_sg
                    if late(what):
                        continue
                    try:
                        ec2.revoke_security_group_ingress(GroupId=db_sg, IpPermissions=[{'IpProtocol': 'tcp',
                            'FromPort': port, 'ToPort': port, 'UserIdGroupPairs': [{'GroupId': gid}]}])
                    except Exception as e:
                        if code(e) != 'InvalidPermission.NotFound':
                            problems[what] = what + ': ' + str(e)
                if refs:
                    refs = attempt('reading ' + db_sg, lambda: referencing(gids))
                    if refs:
                        problems['rule'] = db_sg + ' still allows ingress from ' + ', '.join(refs)
                    elif refs is not None:
                        done.append(db_sg + ' restored')
                if refs == []:
                    for k in [k for k in problems if k == 'rule' or k.startswith('revoking ingress from ')]:
                        del problems[k]

            if groups:
                restore(groups)

            while pending != [] and time.time() < deadline - 15:
                time.sleep(5)
                pending = sweep()

            def delete(gid):
                what = 'deleting ' + gid
                while time.time() < deadline - 12:
                    try:
                        ec2.delete_security_group(GroupId=gid)
                    except Exception as e:
                        c = code(e)
                        if c == 'InvalidGroup.NotFound':
                            problems.pop(what, None)
                            return
                        problems[what] = what + ': ' + str(e)
                        if c not in ('', 'DependencyViolation', 'InvalidGroup.InUse', 'RequestLimitExceeded'):
                            return
                        sweep()
                        restore([gid])
                        time.sleep(max(0, min(3, deadline - 12 - time.time())))
                        continue
                    done.append('deleted ' + gid)
                    problems.pop(what, None)
                    deleted.add(gid)
                    return

            for gid in groups:
                delete(gid)

            time.sleep(max(0, min(start + 20, deadline - 12) - time.time()))
            left_instances = sweep()
            if left_instances is None:
                if known['err']:
                    problems['instances'] = 'listing instances: ' + known['err']
                left_instances = known['pending']
            if left_instances:
                problems['left'] = ('not yet terminated: ' + ', '.join(left_instances) +
                                    ('; ' + known['term'] if known['term'] else ''))
            left = attempt('listing the security group', list_groups)
            if left:
                restore(left)
                for gid in left:
                    delete(gid)
                left = attempt('listing the security group', list_groups)
            if seen:
                restore(sorted(seen))
            if left is not None:
                for gid in seen - set(left):
                    problems.pop('deleting ' + gid, None)
            left = [g for g in (listed if left is None else left) if g not in deleted]
            if left:
                problems['groups'] = 'still present: ' + ', '.join(left)

            done = list(dict.fromkeys(done))
            print('; '.join(done) or 'Nothing of this run was found.')
            if problems:
                raise RuntimeError('Cleanup of execution ' + xid + ' is incomplete: ' + '; '.join(problems.values()) +
                                   '. Tables ' + tables + ' may also remain if a table step failed.'
                                   ' See the README Stop Conditions section for the manual restore.')
            return {'Done': done, 'Tables': tables}
      InputPayload:
        ExecutionId: '{{ automation:EXECUTION_ID }}'
        VpcId: '{{ VpcId }}'
        DatabaseSecurityGroupId: '{{ DatabaseSecurityGroupId }}'
        DatabasePort: '{{ DatabasePort }}'
        DeadlineSeconds: '50'

outputs:
  - LaunchLoadGenerator.InstanceId
  - CreateSecurityGroup.SecurityGroupId
