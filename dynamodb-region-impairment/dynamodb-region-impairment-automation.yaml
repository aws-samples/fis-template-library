description: "Block DynamoDB table access in one Region by adding a deny statement to the table's resource-based policy, then remove it"
schemaVersion: "0.3"
assumeRole: "{{ AutomationAssumeRole }}"
parameters:
  tableName:
    type: String
    description: "DynamoDB table name to impair"
    default: "my-global-table"
  targetRegion:
    type: String
    description: "AWS Region to block DynamoDB access in"
    default: "us-east-1"
  duration:
    type: String
    description: "Duration of the impairment in ISO8601 format"
    default: "PT10M"
  AutomationAssumeRole:
    type: String
    description: "IAM role for the automation execution"
    default: ""

mainSteps:
  - name: waitForFISAction
    action: aws:sleep
    inputs:
      Duration: PT10S

  - name: applyDenyPolicy
    action: aws:executeScript
    timeoutSeconds: 120
    onFailure: step:cleanupPolicy
    onCancel: step:cleanupPolicy
    inputs:
      Runtime: python3.11
      Handler: apply_deny_policy
      Script: |
        import json
        import time
        import boto3
        from botocore.exceptions import ClientError

        SID = "FISDenyAccess"
        FIS_PREFIX = "DoNotModifyFisDynamoDbPauseReplication"
        ACTIONS = [
            "dynamodb:GetItem", "dynamodb:BatchGetItem", "dynamodb:Query", "dynamodb:Scan",
            "dynamodb:PutItem", "dynamodb:UpdateItem", "dynamodb:DeleteItem", "dynamodb:BatchWriteItem",
            "dynamodb:ConditionCheckItem", "dynamodb:PartiQLSelect", "dynamodb:PartiQLInsert",
            "dynamodb:PartiQLUpdate", "dynamodb:PartiQLDelete"
        ]

        def read_policy(ddb, arn):
            try:
                r = ddb.get_resource_policy(ResourceArn=arn)
                return json.loads(r["Policy"]), r["RevisionId"]
            except ClientError as e:
                if e.response["Error"]["Code"] == "PolicyNotFoundException":
                    return None, "NO_POLICY"
                raise

        def statements(policy):
            st = (policy or {}).get("Statement", [])
            return st if isinstance(st, list) else [st]

        def sids(policy):
            return [s.get("Sid", "") for s in statements(policy)]

        def apply_deny_policy(events, context):
            table = events["tableName"]
            region = events["targetRegion"]
            ddb = boto3.client("dynamodb", region_name=region)
            desc = ddb.describe_table(TableName=table)["Table"]
            arn = desc["TableArn"]
            indexes = [i["IndexName"] for i in desc.get("GlobalSecondaryIndexes", []) + desc.get("LocalSecondaryIndexes", [])]
            account = arn.split(":")[4]
            replication_role = ("arn:aws:iam::" + account + ":role/aws-service-role/"
                                "replication.dynamodb.amazonaws.com/AWSServiceRoleForDynamoDBReplication")
            # Every principal is denied except the DynamoDB replication service-linked role, so replication stays
            # under the FIS pause action's control. Each index is listed, because the table ARN does not cover it.
            deny = {
                "Sid": SID,
                "Effect": "Deny",
                "Principal": "*",
                "Action": ACTIONS,
                "Resource": [arn] + [arn + "/index/" + n for n in indexes],
                "Condition": {"ArnNotEquals": {"aws:PrincipalArn": replication_role}}
            }
            # GetResourcePolicy is eventually consistent. Wait until the FIS pause statement is visible, then write
            # with ExpectedRevisionId so the deny can only be added to the revision that was read.
            deadline = time.time() + 60
            policy, rev = read_policy(ddb, arn)
            while not any(s.startswith(FIS_PREFIX) for s in sids(policy)) and time.time() < deadline:
                time.sleep(5)
                policy, rev = read_policy(ddb, arn)
            if not any(s.startswith(FIS_PREFIX) for s in sids(policy)):
                print("WARNING: no FIS pause statement on " + arn + " after 60 s; adding the deny anyway")
            for attempt in range(8):
                if SID in sids(policy):
                    print(SID + " is already on " + arn)
                    return {"tableArn": arn}
                new = dict(policy) if policy else {"Version": "2012-10-17"}
                new["Statement"] = statements(policy) + [deny]
                try:
                    ddb.put_resource_policy(ResourceArn=arn, Policy=json.dumps(new), ExpectedRevisionId=rev)
                    print("Added " + SID + " to " + arn + " (expected revision " + rev + ")")
                    return {"tableArn": arn}
                except ClientError as e:
                    print("Put failed (" + e.response["Error"]["Code"] + "); reading the policy again")
                    time.sleep(min(2 ** attempt, 15))
                    policy, rev = read_policy(ddb, arn)
            raise Exception("Could not add " + SID + " to " + arn)
      InputPayload:
        tableName: "{{ tableName }}"
        targetRegion: "{{ targetRegion }}"
    outputs:
      - Name: tableArn
        Selector: $.Payload.tableArn
        Type: String

  - name: waitForDuration
    action: aws:sleep
    onFailure: step:cleanupPolicy
    onCancel: step:cleanupPolicy
    inputs:
      Duration: "{{ duration }}"

  - name: cleanupPolicy
    action: aws:executeScript
    timeoutSeconds: 100
    inputs:
      Runtime: python3.11
      Handler: cleanup_policy
      Script: |
        import json
        import time
        import boto3
        from botocore.exceptions import ClientError

        SID = "FISDenyAccess"

        def read_policy(ddb, arn):
            try:
                r = ddb.get_resource_policy(ResourceArn=arn)
                return json.loads(r["Policy"]), r["RevisionId"]
            except ClientError as e:
                if e.response["Error"]["Code"] == "PolicyNotFoundException":
                    return None, "NO_POLICY"
                raise

        def statements(policy):
            st = (policy or {}).get("Statement", [])
            return st if isinstance(st, list) else [st]

        def cleanup_policy(events, context):
            table = events["tableName"]
            region = events["targetRegion"]
            ddb = boto3.client("dynamodb", region_name=region)
            arn = ddb.describe_table(TableName=table)["Table"]["TableArn"]
            # Remove only FISDenyAccess and keep every other statement. Each write is conditional on the revision
            # just read. DynamoDB blocks policy updates for 15 s after each successful update, and FIS removes its
            # own statements at the same moment when the experiment is stopped, so the step ends only after 6 reads
            # in a row, 5 s apart, without the statement. The loop fits Automation's two-minute cancellation limit.
            deadline = time.time() + 75
            clean = 0
            while time.time() < deadline:
                policy, rev = read_policy(ddb, arn)
                keep = [s for s in statements(policy) if s.get("Sid") != SID]
                if len(keep) == len(statements(policy)):
                    clean += 1
                    if clean >= 6:
                        print(SID + " is not on " + arn)
                        return {"tableArn": arn, "remainingSids": [s.get("Sid", "") for s in keep]}
                else:
                    clean = 0
                    try:
                        if keep:
                            new = dict(policy)
                            new["Statement"] = keep
                            ddb.put_resource_policy(ResourceArn=arn, Policy=json.dumps(new), ExpectedRevisionId=rev)
                        else:
                            ddb.delete_resource_policy(ResourceArn=arn, ExpectedRevisionId=rev)
                        print("Removed " + SID + " from " + arn + " (expected revision " + rev + ")")
                    except ClientError as e:
                        print("Write failed (" + e.response["Error"]["Code"] + "); reading the policy again")
                time.sleep(5)
            raise Exception(SID + " is still on " + arn + " after 75 s")
      InputPayload:
        tableName: "{{ tableName }}"
        targetRegion: "{{ targetRegion }}"
