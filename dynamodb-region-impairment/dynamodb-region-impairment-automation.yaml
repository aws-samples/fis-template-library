description: "Block reads and writes on one DynamoDB table in one Region by adding a deny statement, with its own expiry, to the table's resource-based policy, then remove that statement"
schemaVersion: "0.3"
assumeRole: "{{ AutomationAssumeRole }}"
parameters:
  tableName:
    type: String
    description: "Name of the DynamoDB table to block. The table must have the tag FIS-Ready=True in targetRegion."
    default: "my-global-table"
    allowedPattern: "^[a-zA-Z0-9_.-]{3,255}$"
  targetRegion:
    type: String
    description: "AWS Region to block DynamoDB access in"
    default: "us-east-1"
    allowedPattern: "^[a-z]{2}(-[a-z]+)+-[0-9]+$"
  duration:
    type: String
    description: "How long to block access, in ISO 8601 format, from PT1M to PT11H50M (the FIS action's maxDuration, at most 12 hours, must be duration plus 8 minutes)"
    default: "PT10M"
    allowedPattern: "^PT([0-9]+H)?([0-9]+M)?([0-9]+S)?$"
  AutomationAssumeRole:
    type: String
    description: "ARN of the IAM role for the automation execution"
    allowedPattern: "^arn:aws[a-z-]*:iam::[0-9]{12}:role/[a-zA-Z0-9+=,.@_/-]+$"

mainSteps:
  - name: waitForFISAction
    action: aws:sleep
    inputs:
      Duration: PT10S

  - name: applyDenyPolicy
    action: aws:executeScript
    timeoutSeconds: 240
    onFailure: step:cleanupPolicy
    onCancel: step:cleanupPolicyOnCancel
    isCritical: true
    inputs:
      Runtime: python3.11
      Handler: apply_deny_policy
      Script: |
        import json
        import re
        import time
        from datetime import datetime, timedelta, timezone
        import boto3
        from botocore.config import Config
        from botocore.exceptions import BotoCoreError, ClientError

        SID_PREFIX = "FISDenyAccess"
        FIS_PREFIX = "DoNotModifyFisDynamoDbPauseReplication"
        EXPIRY_MARGIN = 120
        PAUSE_WAIT = 40
        SETTLE = 15
        WRITE_WINDOW = 90
        UNDO_WINDOW = 70
        UNDO_CLEAN = 10
        NOT_RETRYABLE = ("AccessDeniedException", "ValidationException", "ResourceNotFoundException",
                         "UnrecognizedClientException", "MissingAuthenticationTokenException")
        ACTIONS = [
            "dynamodb:GetItem", "dynamodb:BatchGetItem", "dynamodb:Query", "dynamodb:Scan",
            "dynamodb:PutItem", "dynamodb:UpdateItem", "dynamodb:DeleteItem", "dynamodb:BatchWriteItem",
            "dynamodb:ConditionCheckItem", "dynamodb:PartiQLSelect", "dynamodb:PartiQLInsert",
            "dynamodb:PartiQLUpdate", "dynamodb:PartiQLDelete"
        ]

        def statement_id(execution_id):
            sid = SID_PREFIX + execution_id.replace("-", "")
            if not re.fullmatch(r"[A-Za-z0-9]{1,100}", sid):
                raise Exception("Execution ID " + execution_id + " gives an invalid statement ID")
            return sid

        def duration_seconds(value):
            m = re.fullmatch(r"PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?", value)
            if not m:
                raise Exception("duration " + value + " is not an ISO 8601 duration such as PT10M")
            h, mi, s = (int(x or 0) for x in m.groups())
            total = h * 3600 + mi * 60 + s
            if total < 60 or total > 42600:
                raise Exception("duration must be between PT1M and PT11H50M, got " + value)
            return total

        def read_policy(ddb, arn):
            try:
                r = ddb.get_resource_policy(ResourceArn=arn)
                return json.loads(r["Policy"]), r["RevisionId"]
            except ClientError as e:
                if e.response["Error"]["Code"] == "PolicyNotFoundException":
                    return None, "NO_POLICY"
                raise

        def statements(policy):
            st = (policy or {}).get("Statement", [])
            return st if isinstance(st, list) else [st]

        def sids(policy):
            return [s.get("Sid", "") for s in statements(policy)]

        def live_pause(policy):
            # A pause statement counts only while its own expiry is in the future, so one left by an earlier
            # experiment doesn't. An expiry that can't be read doesn't count either: the step then fails safe.
            now = datetime.now(timezone.utc)
            for s in statements(policy):
                if not s.get("Sid", "").startswith(FIS_PREFIX):
                    continue
                until = s.get("Condition", {}).get("DateLessThan", {}).get("aws:CurrentTime", "")
                try:
                    end = datetime.fromisoformat(until.replace("Z", "+00:00"))
                except (ValueError, AttributeError):
                    continue
                if end.tzinfo is not None and end > now:
                    return True
            return False

        def has_fis_tag(ddb, arn):
            kwargs = {"ResourceArn": arn}
            while True:
                r = ddb.list_tags_of_resource(**kwargs)
                for t in r.get("Tags", []):
                    if t.get("Key") == "FIS-Ready" and t.get("Value") == "True":
                        return True
                if not r.get("NextToken"):
                    return False
                kwargs["NextToken"] = r["NextToken"]

        def cancelling(ssm, execution_id):
            # SSM doesn't document whether a running script step is stopped when the execution is cancelled, and in
            # testing a cancelled script ran on. Checking the execution's own status before each read and right before
            # each put means a step that runs on after a stop adds nothing more once SSM reports the cancel. A status
            # read that fails 3 times raises (at most about 32 s). Before a read, the step then fails without writing.
            # Right before a put, no put is sent: a retryable error sends the loop round again, so the step never puts
            # without a status read that succeeded just before it.
            for attempt in range(3):
                try:
                    r = ssm.get_automation_execution(AutomationExecutionId=execution_id)
                    return r["AutomationExecution"]["AutomationExecutionStatus"] in ("Cancelling", "Cancelled")
                except (BotoCoreError, ClientError) as e:
                    if attempt == 2:
                        raise
                    print("Status read failed (" + type(e).__name__ + "); trying again")
                    time.sleep(1)

        def undo_own(ddb, arn, sid):
            # Runs when the step ends without success after it sent a put: remove this run's statement if it is there,
            # and keep reading, because GetResourcePolicy is eventually consistent and a put whose reply was lost may
            # become visible later. Ends only after UNDO_CLEAN reads in a row, 5 s apart (at least 45 s), without the
            # statement. Returns False if that wasn't confirmed within UNDO_WINDOW seconds.
            deadline = time.time() + UNDO_WINDOW
            clean = 0
            while time.time() < deadline:
                try:
                    policy, rev = read_policy(ddb, arn)
                    keep = [s for s in statements(policy) if s.get("Sid") != sid]
                    if len(keep) == len(statements(policy)):
                        clean += 1
                        if clean >= UNDO_CLEAN:
                            return True
                    else:
                        clean = 0
                        if keep:
                            new = dict(policy)
                            new["Statement"] = keep
                            ddb.put_resource_policy(ResourceArn=arn, Policy=json.dumps(new), ExpectedRevisionId=rev)
                        else:
                            ddb.delete_resource_policy(ResourceArn=arn, ExpectedRevisionId=rev)
                        print("Removed " + sid + " again")
                except Exception as e:
                    clean = 0
                    print("Undo call failed (" + type(e).__name__ + "); trying again")
                if time.time() + 5 < deadline:
                    time.sleep(5)
                else:
                    break
            return False

        def apply_deny_policy(events, context):
            started = time.time()
            table = events["tableName"]
            region = events["targetRegion"]
            execution_id = events["executionId"]
            seconds = duration_seconds(events["duration"])
            sid = statement_id(execution_id)
            setup = boto3.client("dynamodb", region_name=region, config=Config(
                connect_timeout=3, read_timeout=7, retries={"total_max_attempts": 3, "mode": "standard"}))
            # Inside the loops each call is tried once, so no call outlasts 10 s; the loops retry until their deadlines.
            ddb = boto3.client("dynamodb", region_name=region, config=Config(
                connect_timeout=3, read_timeout=7, retries={"total_max_attempts": 1, "mode": "standard"}))
            ssm = boto3.client("ssm", config=Config(
                connect_timeout=3, read_timeout=7, retries={"total_max_attempts": 1, "mode": "standard"}))
            desc = setup.describe_table(TableName=table)["Table"]
            arn = desc["TableArn"]
            if not has_fis_tag(setup, arn):
                raise Exception(arn + " does not have the tag FIS-Ready=True; nothing was changed")
            indexes = [i["IndexName"] for i in desc.get("GlobalSecondaryIndexes", []) + desc.get("LocalSecondaryIndexes", [])]
            partition, account = arn.split(":")[1], arn.split(":")[4]
            replication_role = ("arn:" + partition + ":iam::" + account + ":role/aws-service-role/"
                                "replication.dynamodb.amazonaws.com/AWSServiceRoleForDynamoDBReplication")
            # GetResourcePolicy is eventually consistent. Wait until an unexpired FIS pause statement is visible, so
            # the block doesn't start before the pause. Then wait out DynamoDB's 15-second block on policy updates
            # after FIS's own update.
            deadline = time.time() + PAUSE_WAIT
            seen = []
            while True:
                if time.time() >= deadline:
                    raise Exception("No unexpired FIS pause statement on " + arn + " after " + str(PAUSE_WAIT)
                                    + " s (statements seen: " + ", ".join(seen) + "); nothing was changed")
                if cancelling(ssm, execution_id):
                    raise Exception("The execution is being cancelled; nothing was changed")
                try:
                    policy, rev = read_policy(ddb, arn)
                    seen = sids(policy)
                    if live_pause(policy):
                        break
                except ClientError as e:
                    if e.response["Error"]["Code"] in NOT_RETRYABLE:
                        raise
                    print("Read failed (" + e.response["Error"]["Code"] + "); trying again")
                except BotoCoreError as e:
                    print("Read failed (" + type(e).__name__ + "); trying again")
                time.sleep(5)
            time.sleep(SETTLE)
            # The deny is written only into a revision that still holds an unexpired FIS pause statement, and with
            # ExpectedRevisionId, so DynamoDB accepts it only while that revision is current: once FIS has removed its
            # statements (at the end of the pause or on a stop), no put from this step can succeed. `attempted` is set
            # before every put, because a put can succeed on the server even when its reply is lost.
            deadline = started + WRITE_WINDOW
            attempted = False
            expires = ""
            try:
                while True:
                    if cancelling(ssm, execution_id):
                        raise Exception("The execution is being cancelled")
                    code = None
                    try:
                        policy, rev = read_policy(ddb, arn)
                        present = sid in sids(policy)
                        if present:
                            print(sid + " is on " + arn)
                        elif time.time() >= deadline:
                            raise Exception("Could not add " + sid + " to " + arn + " within " + str(WRITE_WINDOW)
                                            + " s of the step start")
                        elif not live_pause(policy):
                            raise Exception("The FIS pause statement is no longer on " + arn + "; " + sid + " was not added")
                        if not present:
                            expires = (datetime.now(timezone.utc) + timedelta(seconds=seconds + EXPIRY_MARGIN)).strftime("%Y-%m-%dT%H:%M:%SZ")
                            # Every principal is denied except the DynamoDB replication service-linked role, so replication
                            # stays under the FIS pause action's control. Each index is listed, because the table ARN does not
                            # cover it. The deny stops applying at its expiry even if no cleanup step runs.
                            deny = {
                                "Sid": sid,
                                "Effect": "Deny",
                                "Principal": "*",
                                "Action": ACTIONS,
                                "Resource": [arn] + [arn + "/index/" + n for n in indexes],
                                "Condition": {
                                    "ArnNotEquals": {"aws:PrincipalArn": replication_role},
                                    "DateLessThan": {"aws:CurrentTime": expires}
                                }
                            }
                            new = dict(policy) if policy else {"Version": "2012-10-17"}
                            new["Statement"] = statements(policy) + [deny]
                            # A cancelled script keeps running, so read the execution's status again right before the put.
                            if cancelling(ssm, execution_id):
                                raise Exception("The execution is being cancelled")
                            attempted = True
                            ddb.put_resource_policy(ResourceArn=arn, Policy=json.dumps(new), ExpectedRevisionId=rev)
                            print("Added " + sid + " to " + arn + ", expires " + expires + " (expected revision " + rev + ")")
                    except ClientError as e:
                        code = e.response["Error"]["Code"]
                        if code in NOT_RETRYABLE:
                            raise
                        print("Call failed (" + code + "); reading the policy again")
                    except BotoCoreError as e:
                        code = type(e).__name__
                        print("Call failed (" + code + "); reading the policy again")
                    if code is None:
                        if cancelling(ssm, execution_id):
                            raise Exception("The execution was cancelled while " + sid + " was being added")
                        return {"tableArn": arn, "statementId": sid}
                    time.sleep(5)
            except Exception as e:
                # Raised "from None", with the step's own sentence first and the error it reports cut to 300
                # characters, so SSM's failure message (cut at 1,024 characters) shows what this step did.
                error = str(e)[:300]
                if not attempted:
                    raise Exception("Nothing was changed: " + error) from None
                if undo_own(ddb, arn, sid):
                    raise Exception("This step sent a put for " + sid + " and has confirmed it is not on " + arn
                                    + ": " + error) from None
                raise Exception("This step sent a put for " + sid + " and could not confirm it is gone from " + arn
                                + " (the cleanup step removes it, and it stops applying at " + (expires or "its expiry")
                                + "): " + error) from None
      InputPayload:
        tableName: "{{ tableName }}"
        targetRegion: "{{ targetRegion }}"
        duration: "{{ duration }}"
        executionId: "{{ automation:EXECUTION_ID }}"
    outputs:
      - Name: tableArn
        Selector: $.Payload.tableArn
        Type: String
      - Name: statementId
        Selector: $.Payload.statementId
        Type: String

  - name: waitForDuration
    action: aws:sleep
    onFailure: step:cleanupPolicy
    onCancel: step:cleanupPolicyOnCancel
    inputs:
      Duration: "{{ duration }}"

  - name: checkDenyPresent
    action: aws:executeScript
    timeoutSeconds: 70
    onFailure: step:cleanupPolicy
    onCancel: step:cleanupPolicyOnCancel
    isCritical: true
    inputs:
      Runtime: python3.11
      Handler: check_deny_present
      Script: |
        import json
        import time
        import boto3
        from botocore.config import Config
        from botocore.exceptions import BotoCoreError, ClientError

        def check_deny_present(events, context):
            sid = "FISDenyAccess" + events["executionId"].replace("-", "")
            region = events["targetRegion"]
            setup = boto3.client("dynamodb", region_name=region, config=Config(
                connect_timeout=3, read_timeout=7, retries={"total_max_attempts": 2, "mode": "standard"}))
            ddb = boto3.client("dynamodb", region_name=region, config=Config(
                connect_timeout=3, read_timeout=7, retries={"total_max_attempts": 1, "mode": "standard"}))
            arn = setup.describe_table(TableName=events["tableName"])["Table"]["TableArn"]
            # GetResourcePolicy is eventually consistent, so the statement counts as present if any of 3 reads shows it.
            # Every path ends within 20 s + 3 x 10 s + 2 x 5 s = 60 s, inside the step's 70-s timeout.
            errors = 0
            for attempt in range(3):
                if attempt:
                    time.sleep(5)
                try:
                    r = ddb.get_resource_policy(ResourceArn=arn)
                    st = json.loads(r["Policy"]).get("Statement", [])
                    st = st if isinstance(st, list) else [st]
                    if any(s.get("Sid") == sid for s in st):
                        print(sid + " is still on " + arn)
                        return {"tableArn": arn}
                except ClientError as e:
                    if e.response["Error"]["Code"] != "PolicyNotFoundException":
                        errors += 1
                        print("Read failed (" + e.response["Error"]["Code"] + ")")
                except BotoCoreError as e:
                    errors += 1
                    print("Read failed (" + type(e).__name__ + ")")
            if errors == 3:
                raise Exception("Could not read the policy of " + arn + " to check that " + sid + " is still there")
            raise Exception(sid + " was removed from " + arn + " before the planned end; the fault was cut short")
      InputPayload:
        tableName: "{{ tableName }}"
        targetRegion: "{{ targetRegion }}"
        executionId: "{{ automation:EXECUTION_ID }}"

  - name: cleanupPolicy
    action: aws:executeScript
    timeoutSeconds: 115
    onCancel: step:cleanupPolicyOnCancel
    isCritical: true
    isEnd: true
    inputs:
      Runtime: python3.11
      Handler: cleanup_policy
      Script: |
        import json
        import time
        from datetime import datetime, timezone
        import boto3
        from botocore.config import Config
        from botocore.exceptions import ClientError

        FIS_PREFIX = "DoNotModifyFisDynamoDbPauseReplication"
        STOP_WAIT = 15
        LAST_START = 80
        CLEAN_READS = 10
        PAUSE_GONE_READS = 6

        def read_policy(ddb, arn):
            try:
                r = ddb.get_resource_policy(ResourceArn=arn)
                return json.loads(r["Policy"]), r["RevisionId"]
            except ClientError as e:
                if e.response["Error"]["Code"] == "PolicyNotFoundException":
                    return None, "NO_POLICY"
                raise

        def statements(policy):
            st = (policy or {}).get("Statement", [])
            return st if isinstance(st, list) else [st]

        def live_pause(policy):
            # While an FIS pause statement whose own expiry is in the future, or can't be read, is on the policy: the
            # latest such expiry, or "unreadable". Otherwise "".
            now = datetime.now(timezone.utc)
            latest, text = None, ""
            for s in statements(policy):
                if not s.get("Sid", "").startswith(FIS_PREFIX):
                    continue
                until = s.get("Condition", {}).get("DateLessThan", {}).get("aws:CurrentTime", "")
                try:
                    end = datetime.fromisoformat(until.replace("Z", "+00:00"))
                except (ValueError, AttributeError):
                    return "unreadable"
                if end.tzinfo is None:
                    return "unreadable"
                if end > now and (latest is None or end > latest):
                    latest, text = end, until
            return text

        def cleanup_policy(events, context):
            started = time.time()
            sid = "FISDenyAccess" + events["executionId"].replace("-", "")
            on_stop = events["onStop"] == "true"
            # Each call is tried once, so no call outlasts 10 s; the loop retries until its deadline.
            ddb = boto3.client("dynamodb", region_name=events["targetRegion"], config=Config(
                connect_timeout=3, read_timeout=7, retries={"total_max_attempts": 1, "mode": "standard"}))
            # Remove only this run's statement and keep every other one. Each write is conditional on the revision just
            # read. GetResourcePolicy is eventually consistent, so on the normal path the step ends only after 10 reads in
            # a row, 5 s apart (at least 45 s), without the statement. On a stop (onStop), FIS removes its own pause
            # statements from the same policy, and DynamoDB blocks policy updates for 15 s after each update: the step
            # first waits 15 s, so FIS's removal can land before this step's first write, and then ends once 6 reads in a
            # row, 5 s apart (at least 25 s), show neither this run's statement nor an unexpired FIS pause statement.
            # A copy FIS writes back while this step is still reading that still holds the deny is removed again, and
            # applyDenyPolicy can't add the deny after FIS's removal, because it writes only into a revision that holds
            # the pause. FIS's removal can land after this step ends, when DynamoDB rejects its first tries, so a pause
            # statement still there at the end doesn't fail this step: it succeeds if this run's statement wasn't in the
            # last 6 reads, and says what its last read showed. No iteration starts after 80 s and each makes at most 3
            # calls of at most 10 s, so the script ends by about 110 s.
            if on_stop:
                time.sleep(STOP_WAIT)
            arn = None
            clean = 0
            pause_gone = 0
            last = None
            pause_until = ""
            removed = False
            while time.time() - started < LAST_START:
                try:
                    if arn is None:
                        try:
                            arn = ddb.describe_table(TableName=events["tableName"])["Table"]["TableArn"]
                        except ClientError as e:
                            if e.response["Error"]["Code"] == "ResourceNotFoundException":
                                print("Table " + events["tableName"] + " does not exist; nothing to remove")
                                return {"removed": "false", "tableArn": ""}
                            raise
                    policy, rev = read_policy(ddb, arn)
                    mine = [s for s in statements(policy) if s.get("Sid") == sid]
                    keep = [s for s in statements(policy) if s.get("Sid") != sid]
                    if not mine:
                        clean += 1
                        pause_until = live_pause(policy)
                        pause_gone = 0 if pause_until else pause_gone + 1
                        if (pause_gone >= PAUSE_GONE_READS) if on_stop else (clean >= CLEAN_READS):
                            print(sid + " is not on " + arn + ("; this step removed it" if removed else "; this step found nothing to remove"))
                            return {"removed": "true" if removed else "false", "tableArn": arn}
                    else:
                        clean = 0
                        pause_gone = 0
                        last = mine[0]
                        if keep:
                            new = dict(policy)
                            new["Statement"] = keep
                            ddb.put_resource_policy(ResourceArn=arn, Policy=json.dumps(new), ExpectedRevisionId=rev)
                        else:
                            ddb.delete_resource_policy(ResourceArn=arn, ExpectedRevisionId=rev)
                        removed = True
                        print("Removed " + sid + " from " + arn + " (expected revision " + rev + ")")
                except Exception as e:
                    clean = 0
                    pause_gone = 0
                    print("Call failed (" + type(e).__name__ + ": " + str(e)[:200] + "); trying again")
                if time.time() - started + 5 < LAST_START:
                    time.sleep(5)
                else:
                    break
            if on_stop and clean >= PAUSE_GONE_READS:
                # This run's statement is gone. FIS removes its own pause statements, so say what the last read showed.
                print(sid + " is not on " + str(arn) + ("; this step removed it" if removed else "; this step found nothing to remove"))
                if pause_gone:
                    print("No unexpired FIS pause statement was on the policy in the last " + str(pause_gone) + " reads")
                else:
                    print("An unexpired FIS pause statement was still on the policy at this step's last read, "
                          + str(int(time.time() - started)) + " s after the stop (expiry: " + pause_until
                          + "). Replication stays paused until FIS removes it, and at the latest until its expiry")
                return {"removed": "true" if removed else "false", "tableArn": arn}
            expiry = ""
            if last:
                expiry = last.get("Condition", {}).get("DateLessThan", {}).get("aws:CurrentTime", "")
            raise Exception(sid + " may still be on " + str(arn or events["tableName"]) + " after "
                            + str(int(time.time() - started)) + " s. It stops applying at " + (expiry or "its expiry")
                            + "; remove it from the table's resource policy by hand")
      InputPayload:
        tableName: "{{ tableName }}"
        targetRegion: "{{ targetRegion }}"
        executionId: "{{ automation:EXECUTION_ID }}"
        onStop: "false"
    outputs:
      - Name: removed
        Selector: $.Payload.removed
        Type: String

  - name: cleanupPolicyOnCancel
    action: aws:executeScript
    timeoutSeconds: 115
    isCritical: true
    isEnd: true
    inputs:
      Runtime: python3.11
      Handler: cleanup_policy
      Script: |
        import json
        import time
        from datetime import datetime, timezone
        import boto3
        from botocore.config import Config
        from botocore.exceptions import ClientError

        FIS_PREFIX = "DoNotModifyFisDynamoDbPauseReplication"
        STOP_WAIT = 15
        LAST_START = 80
        CLEAN_READS = 10
        PAUSE_GONE_READS = 6

        def read_policy(ddb, arn):
            try:
                r = ddb.get_resource_policy(ResourceArn=arn)
                return json.loads(r["Policy"]), r["RevisionId"]
            except ClientError as e:
                if e.response["Error"]["Code"] == "PolicyNotFoundException":
                    return None, "NO_POLICY"
                raise

        def statements(policy):
            st = (policy or {}).get("Statement", [])
            return st if isinstance(st, list) else [st]

        def live_pause(policy):
            # While an FIS pause statement whose own expiry is in the future, or can't be read, is on the policy: the
            # latest such expiry, or "unreadable". Otherwise "".
            now = datetime.now(timezone.utc)
            latest, text = None, ""
            for s in statements(policy):
                if not s.get("Sid", "").startswith(FIS_PREFIX):
                    continue
                until = s.get("Condition", {}).get("DateLessThan", {}).get("aws:CurrentTime", "")
                try:
                    end = datetime.fromisoformat(until.replace("Z", "+00:00"))
                except (ValueError, AttributeError):
                    return "unreadable"
                if end.tzinfo is None:
                    return "unreadable"
                if end > now and (latest is None or end > latest):
                    latest, text = end, until
            return text

        def cleanup_policy(events, context):
            started = time.time()
            sid = "FISDenyAccess" + events["executionId"].replace("-", "")
            on_stop = events["onStop"] == "true"
            # Each call is tried once, so no call outlasts 10 s; the loop retries until its deadline.
            ddb = boto3.client("dynamodb", region_name=events["targetRegion"], config=Config(
                connect_timeout=3, read_timeout=7, retries={"total_max_attempts": 1, "mode": "standard"}))
            # Remove only this run's statement and keep every other one. Each write is conditional on the revision just
            # read. GetResourcePolicy is eventually consistent, so on the normal path the step ends only after 10 reads in
            # a row, 5 s apart (at least 45 s), without the statement. On a stop (onStop), FIS removes its own pause
            # statements from the same policy, and DynamoDB blocks policy updates for 15 s after each update: the step
            # first waits 15 s, so FIS's removal can land before this step's first write, and then ends once 6 reads in a
            # row, 5 s apart (at least 25 s), show neither this run's statement nor an unexpired FIS pause statement.
            # A copy FIS writes back while this step is still reading that still holds the deny is removed again, and
            # applyDenyPolicy can't add the deny after FIS's removal, because it writes only into a revision that holds
            # the pause. FIS's removal can land after this step ends, when DynamoDB rejects its first tries, so a pause
            # statement still there at the end doesn't fail this step: it succeeds if this run's statement wasn't in the
            # last 6 reads, and says what its last read showed. No iteration starts after 80 s and each makes at most 3
            # calls of at most 10 s, so the script ends by about 110 s.
            if on_stop:
                time.sleep(STOP_WAIT)
            arn = None
            clean = 0
            pause_gone = 0
            last = None
            pause_until = ""
            removed = False
            while time.time() - started < LAST_START:
                try:
                    if arn is None:
                        try:
                            arn = ddb.describe_table(TableName=events["tableName"])["Table"]["TableArn"]
                        except ClientError as e:
                            if e.response["Error"]["Code"] == "ResourceNotFoundException":
                                print("Table " + events["tableName"] + " does not exist; nothing to remove")
                                return {"removed": "false", "tableArn": ""}
                            raise
                    policy, rev = read_policy(ddb, arn)
                    mine = [s for s in statements(policy) if s.get("Sid") == sid]
                    keep = [s for s in statements(policy) if s.get("Sid") != sid]
                    if not mine:
                        clean += 1
                        pause_until = live_pause(policy)
                        pause_gone = 0 if pause_until else pause_gone + 1
                        if (pause_gone >= PAUSE_GONE_READS) if on_stop else (clean >= CLEAN_READS):
                            print(sid + " is not on " + arn + ("; this step removed it" if removed else "; this step found nothing to remove"))
                            return {"removed": "true" if removed else "false", "tableArn": arn}
                    else:
                        clean = 0
                        pause_gone = 0
                        last = mine[0]
                        if keep:
                            new = dict(policy)
                            new["Statement"] = keep
                            ddb.put_resource_policy(ResourceArn=arn, Policy=json.dumps(new), ExpectedRevisionId=rev)
                        else:
                            ddb.delete_resource_policy(ResourceArn=arn, ExpectedRevisionId=rev)
                        removed = True
                        print("Removed " + sid + " from " + arn + " (expected revision " + rev + ")")
                except Exception as e:
                    clean = 0
                    pause_gone = 0
                    print("Call failed (" + type(e).__name__ + ": " + str(e)[:200] + "); trying again")
                if time.time() - started + 5 < LAST_START:
                    time.sleep(5)
                else:
                    break
            if on_stop and clean >= PAUSE_GONE_READS:
                # This run's statement is gone. FIS removes its own pause statements, so say what the last read showed.
                print(sid + " is not on " + str(arn) + ("; this step removed it" if removed else "; this step found nothing to remove"))
                if pause_gone:
                    print("No unexpired FIS pause statement was on the policy in the last " + str(pause_gone) + " reads")
                else:
                    print("An unexpired FIS pause statement was still on the policy at this step's last read, "
                          + str(int(time.time() - started)) + " s after the stop (expiry: " + pause_until
                          + "). Replication stays paused until FIS removes it, and at the latest until its expiry")
                return {"removed": "true" if removed else "false", "tableArn": arn}
            expiry = ""
            if last:
                expiry = last.get("Condition", {}).get("DateLessThan", {}).get("aws:CurrentTime", "")
            raise Exception(sid + " may still be on " + str(arn or events["tableName"]) + " after "
                            + str(int(time.time() - started)) + " s. It stops applying at " + (expiry or "its expiry")
                            + "; remove it from the table's resource policy by hand")
      InputPayload:
        tableName: "{{ tableName }}"
        targetRegion: "{{ targetRegion }}"
        executionId: "{{ automation:EXECUTION_ID }}"
        onStop: "true"
    outputs:
      - Name: removed
        Selector: $.Payload.removed
        Type: String
