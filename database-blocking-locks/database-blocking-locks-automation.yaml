schemaVersion: '0.3'
description: 'Create load generator and inject blocking locks'
assumeRole: 'arn:aws:iam::{{ global:ACCOUNT_ID }}:role/DatabaseBlockingLocks-SSM-Automation-Role'

parameters:
  DatabaseEngine:
    type: String
    description: 'Database engine type'
    default: 'postgres'
    allowedValues:
      - postgres
      - mysql
      - sqlserver
  DatabaseEndpoint:
    type: String
    description: 'Endpoint hostname of the writer: an RDS instance endpoint, an Aurora cluster endpoint or the writer instance endpoint. Reader, custom and replica endpoints are refused. The instance or cluster it belongs to must have the tag FIS-Ready=True.'
    allowedPattern: '^[A-Za-z0-9.-]{1,253}$'
  DatabasePort:
    type: String
    description: 'Database port number; must be the port of the database DatabaseEndpoint names'
    default: '5432'
    allowedPattern: '^[0-9]{1,5}$'
  DatabaseName:
    type: String
    description: 'User database to connect to. Synthetic_Mode creates fis_blocking_locks_target in it. Not a system database (mysql, master); postgres suits PostgreSQL only.'
    default: 'postgres'
    allowedPattern: '^[A-Za-z0-9_-]{1,128}$'
  DatabaseUser:
    type: String
    description: 'Database username'
    default: 'postgres'
    allowedPattern: '^[A-Za-z0-9_.@-]{1,128}$'
  DatabasePasswordSecretArn:
    type: String
    description: 'ARN of Secrets Manager secret containing database password'
    allowedPattern: '^arn:aws[a-z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@!-]{1,512}$'
  WaiterCount:
    type: String
    description: 'Total number of Waiter sessions to ramp to'
    default: '50'
    allowedPattern: '^[1-9][0-9]{0,3}$'
  ExperimentDuration:
    type: String
    description: 'How long the Blocker holds the row lock, in ISO 8601 PT form (e.g. PT10M, PT1H). At most PT2H.'
    default: 'PT10M'
    allowedPattern: '^PT([0-9]+H)?([0-9]+M)?([0-9]+S)?$'
  RampTime:
    type: String
    description: 'Time to ramp up to WaiterCount in ISO 8601 PT form (e.g. PT1M, PT30S, PT0S for immediate)'
    default: 'PT1M'
    allowedPattern: '^PT([0-9]+H)?([0-9]+M)?([0-9]+S)?$'
  RampSteps:
    type: String
    description: 'Number of steps to reach WaiterCount (e.g., 2=50% then 100%, 10=10% increments)'
    default: '10'
    allowedPattern: '^[0-9]{1,3}$'
  VpcId:
    type: String
    description: 'VPC ID where the load generator will be launched'
    allowedPattern: '^vpc-[0-9a-f]{8,17}$'
  SubnetId:
    type: String
    description: 'Subnet ID for load generator instance'
    allowedPattern: '^subnet-[0-9a-f]{8,17}$'
  DatabaseSecurityGroupId:
    type: String
    description: 'Security group of the target database, which gets a temporary ingress rule. Must have the tag FIS-Ready=True and be attached to the database.'
    allowedPattern: '^sg-[0-9a-f]{8,17}$'
  InstanceType:
    type: String
    description: 'EC2 instance type, x86_64 only (the AMI is x86_64)'
    default: 't3.small'
    allowedPattern: '^[a-z0-9-]+\.[a-z0-9]+$'
  LatestAmiId:
    type: String
    description: 'Amazon Linux 2023 AMI ID'
    default: '{{ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
    allowedPattern: '^(ami-[0-9a-f]{8,17}|\{\{ ?ssm:[A-Za-z0-9/._-]+ ?\}\})$'
  TargetTableName:
    type: String
    description: 'Target table for blocking locks. The default selects Synthetic_Mode; any other name selects Real_Mode (SQL Server accepts schema.table).'
    default: 'fis_blocking_locks_target'
    allowedPattern: '^[A-Za-z_][A-Za-z0-9_]{0,127}(\.[A-Za-z_][A-Za-z0-9_]{0,127})?$'

mainSteps:
  - name: CheckTargets
    action: 'aws:executeScript'
    onFailure: 'Abort'
    onCancel: 'Abort'
    inputs:
      Runtime: python3.11
      Handler: check
      Script: |
        import re, boto3
        from botocore.config import Config
        from botocore.exceptions import ClientError

        def ready(tags):
            return any(t['Key'] == 'FIS-Ready' and t['Value'] == 'True' for t in tags or [])

        def check(events, context):
            h, m, s = (int(x or 0) for x in re.match(r'PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$', events['Duration']).groups())
            if not 0 < h * 3600 + m * 60 + s <= 7200:
                raise Exception('ExperimentDuration must be more than 0 and at most PT2H')
            cfg = Config(retries={'max_attempts': 10, 'mode': 'standard'})
            rds, ec2, ssm = (boto3.client(x, config=cfg) for x in ('rds', 'ec2', 'ssm'))
            ep, sg, port = events['Endpoint'].lower().rstrip('.'), events['SecurityGroupId'], int(events['Port'])
            g = ec2.describe_security_groups(GroupIds=[sg])['SecurityGroups'][0]
            if not ready(g.get('Tags')):
                raise Exception('Security group %s does not have the tag FIS-Ready=True' % sg)
            # The harness creates a table and locks a row, which a read-only server refuses: accept only a writer.
            hits, writer = [], {}
            for page in rds.get_paginator('describe_db_clusters').paginate():
                for d in page['DBClusters']:
                    ms = d.get('DBClusterMembers', [])
                    writer.update((x['DBInstanceIdentifier'], x['IsClusterWriter']) for x in ms)
                    other = [x.lower() for x in [d.get('ReaderEndpoint')] + d.get('CustomEndpoints', []) if x]
                    if ep == (d.get('Endpoint') or '').lower() or ep in other:
                        ro = ep in other or d.get('ReplicationSourceIdentifier') or not any(x['IsClusterWriter'] for x in ms)
                        hits.append((d['DBClusterArn'], d.get('TagList'), d.get('VpcSecurityGroups'), d.get('Port'), ro))
            for page in rds.get_paginator('describe_db_instances').paginate():
                for d in page['DBInstances']:
                    e = d.get('Endpoint') or {}
                    if e.get('Address', '').lower() == ep:
                        ro = (d.get('ReadReplicaSourceDBInstanceIdentifier') or d.get('ReadReplicaSourceDBClusterIdentifier')
                              or not writer.get(d['DBInstanceIdentifier'], True))
                        hits.append((d['DBInstanceArn'], d.get('TagList'), d.get('VpcSecurityGroups'), e.get('Port'), ro))
            if len(hits) != 1:
                raise Exception('Endpoint %s matches %d RDS instances or clusters; it must match exactly one' % (ep, len(hits)))
            arn, tags, groups, p, ro = hits[0]
            if ro:
                raise Exception('%s is not a writer endpoint of %s (a reader, custom or replica endpoint, or a cluster with no writer); '
                                'use the cluster endpoint or the writer instance endpoint' % (ep, arn))
            if not ready(tags):
                raise Exception('%s does not have the tag FIS-Ready=True' % arn)
            if sg not in [x['VpcSecurityGroupId'] for x in groups or []]:
                raise Exception('Security group %s is not attached to %s' % (sg, arn))
            if p != port:
                raise Exception('DatabasePort %d is not the port of %s (%s)' % (port, arn, p))
            # Delete load generator groups an ended run left (its cancel path ran out of time), once no instance uses them.
            pre, done = 'FIS-DatabaseBlockingLocks-LoadGen-', ('Success', 'Failed', 'Cancelled', 'TimedOut', 'Rejected',
                                                               'CompletedWithSuccess', 'CompletedWithFailure', 'Exited')
            for page in ec2.get_paginator('describe_security_groups').paginate(
                    Filters=[{'Name': 'tag:FIS-Experiment', 'Values': ['DatabaseBlockingLocks']}]):
                for x in page['SecurityGroups']:
                    i = x['GroupName'][len(pre):]
                    if not x['GroupName'].startswith(pre) or not re.match(r'^[0-9a-f-]{36}$', i):
                        continue
                    try:
                        st = ssm.get_automation_execution(AutomationExecutionId=i)['AutomationExecution']['AutomationExecutionStatus']
                    except ClientError as y:
                        if y.response['Error']['Code'] != 'AutomationExecutionNotFoundException':
                            raise
                        st = 'Success'
                    if st in done:
                        try:
                            ec2.delete_security_group(GroupId=x['GroupId'])
                            print('Deleted %s, left by ended run %s' % (x['GroupId'], i))
                        except ClientError as y:
                            if y.response['Error']['Code'] not in ('DependencyViolation', 'InvalidGroup.NotFound'):
                                raise
            return {'Database': arn}
      InputPayload:
        Endpoint: '{{ DatabaseEndpoint }}'
        SecurityGroupId: '{{ DatabaseSecurityGroupId }}'
        Duration: '{{ ExperimentDuration }}'
        Port: '{{ DatabasePort }}'
    outputs:
      - Name: Database
        Selector: '$.Payload.Database'
        Type: String

  - name: CreateSecurityGroup
    action: 'aws:executeAwsApi'
    onFailure: 'step:Cleanup'
    onCancel: 'step:CleanupOnCancel'
    inputs:
      Service: ec2
      Api: CreateSecurityGroup
      GroupName: 'FIS-DatabaseBlockingLocks-LoadGen-{{ automation:EXECUTION_ID }}'
      Description: 'FIS database blocking locks experiment'
      VpcId: '{{ VpcId }}'
      TagSpecifications:
        - ResourceType: 'security-group'
          Tags:
            - Key: 'Name'
              Value: 'FIS-DatabaseBlockingLocks-LoadGenerator'
            - Key: 'FIS-Experiment'
              Value: 'DatabaseBlockingLocks'
            - Key: 'AutoCleanup'
              Value: 'true'
            - Key: 'ManagedBy'
              Value: 'FIS-SSM-Automation'
    outputs:
      - Name: SecurityGroupId
        Selector: '$.GroupId'
        Type: String

  - name: AuthorizeInboundFromLoadGenerator
    action: 'aws:executeScript'
    onFailure: 'step:Cleanup'
    onCancel: 'step:CleanupOnCancel'
    inputs:
      Runtime: python3.11
      Handler: h
      Script: |
        import boto3

        def h(e, c):
            p = int(e['Port'])
            boto3.client('ec2').authorize_security_group_ingress(GroupId=e['Db'], IpPermissions=[{
                'IpProtocol': 'tcp', 'FromPort': p, 'ToPort': p,
                'UserIdGroupPairs': [{'GroupId': e['Lg'], 'Description': 'FIS load generator ' + e['Id']}]}])
      InputPayload:
        Lg: '{{ CreateSecurityGroup.SecurityGroupId }}'
        Db: '{{ DatabaseSecurityGroupId }}'
        Port: '{{ DatabasePort }}'
        Id: '{{ automation:EXECUTION_ID }}'

  - name: LaunchLoadGenerator
    action: 'aws:runInstances'
    timeoutSeconds: 600
    onFailure: 'step:Cleanup'
    onCancel: 'step:CleanupOnCancel'
    inputs:
      ImageId: '{{ LatestAmiId }}'
      InstanceType: '{{ InstanceType }}'
      MinInstanceCount: 1
      MaxInstanceCount: 1
      SubnetId: '{{ SubnetId }}'
      SecurityGroupIds:
        - '{{ CreateSecurityGroup.SecurityGroupId }}'
      IamInstanceProfileName: 'DatabaseBlockingLocks-Instance-Profile'
      MetadataOptions:
        HttpTokens: 'required'
      # Its own end if cleanup can't terminate it: '#!/bin/bash shutdown -h +210', and terminate on shutdown.
      InstanceInitiatedShutdownBehavior: 'terminate'
      UserData: 'IyEvYmluL2Jhc2gKc2h1dGRvd24gLWggKzIxMAo='
      TagSpecifications:
        - ResourceType: 'instance'
          Tags:
            - Key: 'Name'
              Value: 'FIS-DatabaseBlockingLocks-LoadGenerator'
            - Key: 'FIS-Execution'
              Value: '{{ automation:EXECUTION_ID }}'
            - Key: 'FIS-Experiment'
              Value: 'DatabaseBlockingLocks'
            - Key: 'AutoCleanup'
              Value: 'true'
            - Key: 'ManagedBy'
              Value: 'FIS-SSM-Automation'
    outputs:
      - Name: InstanceId
        Selector: '$.InstanceIds[0]'
        Type: String

  - name: WaitForSSMAgent
    action: 'aws:waitForAwsResourceProperty'
    timeoutSeconds: 300
    onFailure: 'step:Cleanup'
    onCancel: 'step:CleanupOnCancel'
    inputs:
      Service: ssm
      Api: DescribeInstanceInformation
      InstanceInformationFilterList:
        - key: InstanceIds
          valueSet:
            - '{{ LaunchLoadGenerator.InstanceId }}'
      PropertySelector: '$.InstanceInformationList[0].PingStatus'
      DesiredValues:
        - Online

  - name: InstallDatabaseClient
    action: 'aws:runCommand'
    timeoutSeconds: 960
    onFailure: 'step:Cleanup'
    onCancel: 'step:CleanupOnCancel'
    inputs:
      DocumentName: 'AWS-RunShellScript'
      InstanceIds:
        - '{{ LaunchLoadGenerator.InstanceId }}'
      Parameters:
        executionTimeout: '900'
        commands:
          - |
            #!/bin/bash
            set -e
            ENGINE="{{ DatabaseEngine }}"
            echo "Installing database client for engine: $ENGINE"
            if [ "$ENGINE" = "postgres" ]; then
                dnf install -y postgresql15 python3-pip
                pip3 install psycopg2-binary
            elif [ "$ENGINE" = "mysql" ]; then
                dnf install -y mariadb105 python3-pip
                pip3 install mysql-connector-python
            elif [ "$ENGINE" = "sqlserver" ]; then
                curl https://packages.microsoft.com/config/rhel/9/prod.repo | tee /etc/yum.repos.d/mssql-release.repo
                ACCEPT_EULA=Y dnf install -y mssql-tools18 unixODBC-devel python3-pip
                pip3 install pyodbc
            else
                echo "Unsupported database engine: $ENGINE"
                exit 1
            fi
            # boto3 for Secrets Manager access
            dnf install -y aws-cli
            pip3 install boto3
            echo "Installation complete"

  - name: InjectBlockingLocks
    action: 'aws:runCommand'
    timeoutSeconds: 8100
    onFailure: 'step:StopHarness'
    onCancel: 'step:StopHarness'
    inputs:
      DocumentName: 'AWS-RunShellScript'
      InstanceIds:
        - '{{ LaunchLoadGenerator.InstanceId }}'
      TimeoutSeconds: 600
      Parameters:
        executionTimeout: '7800'
        commands:
          - |
            #!/bin/bash
            set -e
            # Write the harness to a root-only directory on this run's own instance.
            D=/var/lib/fis-blocking-locks
            install -d -m 0700 -o root -g root "$D"
            cat > "$D/harness.py" << 'PYTHON_EOF'
            import json, os, re, signal, sys
            # Record PID and start time first, so StopHarness signals only this process, never a reused PID.
            D = os.path.dirname(os.path.abspath(__file__))
            with open(D + "/pid", "w") as f:
                f.write("%d %s\n" % (os.getpid(), open("/proc/self/stat").read().split()[21]))
            # StopHarness creates "stop" before it reads "pid": if it's there, StopHarness may have missed this process.
            if os.path.exists(D + "/stop"):
                sys.exit(1)
            import threading, time, traceback
            import boto3

            class _TS:  # starts every output line with its UTC time
                def __init__(s, f):
                    s.f, s.n = f, True

                def write(s, x):
                    for l in x.splitlines(True):
                        s.f.write((time.strftime("%Y-%m-%dT%H:%M:%SZ ", time.gmtime()) if s.n else "") + l)
                        s.n = l.endswith("\n")
                    s.f.flush()

                def flush(s):
                    s.f.flush()

            sys.stdout, sys.stderr = _TS(sys.stdout), _TS(sys.stderr)
            SYN = "fis_blocking_locks_target"

            def die(code, msg):
                sys.stderr.write("ERROR: %s\n" % msg)
                sys.exit(code)

            def _quiet(f):
                try:
                    f()
                except Exception:
                    pass

            def q(e, n):
                return {"postgres": '"%s"' % n.replace('"', '""'), "mysql": "`%s`" % n.replace("`", "``"),
                        "sqlserver": "[%s]" % n.replace("]", "]]")}[e]

            def lock_query(e, ref, cols):
                c = ", ".join(q(e, x) for x in cols)
                w = " AND ".join("%s = %s" % (q(e, x), "?" if e == "sqlserver" else "%s") for x in cols)
                if e == "sqlserver":
                    return "SELECT %s FROM %s WITH (UPDLOCK, HOLDLOCK) WHERE %s" % (c, ref, w)
                return "SELECT %s FROM %s WHERE %s FOR UPDATE" % (c, ref, w)

            def ramp_schedule(n, steps, ramp, dur):
                # (seconds to wait before the step, Waiters it starts); the gap is whole seconds, at least 1.
                ramp, k = min(ramp, dur), min(steps, n)
                if ramp <= 0 or k <= 1:
                    return [(0, n)]
                gap = max(ramp // k, 1)
                return [(gap if i else 0, n // k + (n % k if i == k - 1 else 0)) for i in range(k)]

            def get_password(arn, region):
                try:
                    v = boto3.client("secretsmanager", region_name=region).get_secret_value(SecretId=arn).get("SecretString")
                except Exception as x:
                    die(2, "SecretsManager get failed (SecretId=%s): %s: %s" % (arn, type(x).__name__, x))
                if v is None:
                    die(2, "secret %s has no SecretString (binary secrets unsupported)" % arn)
                try:
                    p = json.loads(v)
                except ValueError:
                    return v
                return p["password"] if isinstance(p, dict) and "password" in p else v

            class Harness:
                def __init__(s, e, ep, port, db, user, pw, n, dur, ramp, steps, table):
                    s.e, s.ep, s.port, s.db, s.user, s.pw, s.n, s.dur, s.ramp, s.steps, s.table = (
                        e, ep, port, db, user, pw, n, dur, ramp, steps, table)
                    s.real = table != SYN
                    s.created = s.released = s.ended_early = False
                    s.threads, s.connected, s.early, s.late = [], [], [], []

                def connect(s):
                    try:
                        if s.e == "postgres":
                            import psycopg2
                            c = psycopg2.connect(host=s.ep, port=s.port, database=s.db, user=s.user, password=s.pw,
                                                 connect_timeout=10)
                            c.autocommit = False
                            return c
                        if s.e == "mysql":
                            import mysql.connector
                            return mysql.connector.connect(host=s.ep, port=s.port, database=s.db, user=s.user,
                                                           password=s.pw, connection_timeout=10, autocommit=False)
                        import pyodbc
                        return pyodbc.connect("DRIVER={ODBC Driver 18 for SQL Server};SERVER=%s,%d;DATABASE=%s;UID=%s;"
                                              "PWD={%s};TrustServerCertificate=yes"
                                              % (s.ep, s.port, s.db, s.user, s.pw.replace("}", "}}")), timeout=10, autocommit=False)
                    except Exception as x:
                        die(3, "connect failed to %s at %s:%d db=%s as %s: %s: %s"
                            % (s.e, s.ep, s.port, s.db, s.user, type(x).__name__, x))

                def closed_errors(s):
                    if s.e == "postgres":
                        import psycopg2
                        return (psycopg2.InterfaceError, psycopg2.OperationalError)
                    if s.e == "mysql":
                        import mysql.connector.errors as m
                        return (m.OperationalError, m.InterfaceError)
                    import pyodbc
                    return (pyodbc.Error,)

                @staticmethod
                def sql(conn, stmt, args=None, fetch=None):
                    cur = conn.cursor()
                    try:
                        cur.execute(stmt) if args is None else cur.execute(stmt, args)
                        return getattr(cur, fetch)() if fetch else None
                    finally:
                        _quiet(cur.close)

                def ensure_table(s, conn):
                    ex = s.sql(conn, {
                        "postgres": "SELECT 1 FROM information_schema.tables WHERE table_schema = current_schema() AND table_name = %s",
                        "mysql": "SELECT 1 FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name = %s",
                        "sqlserver": "SELECT 1 WHERE OBJECT_ID(?, 'U') IS NOT NULL"}[s.e],
                        ("dbo." + SYN if s.e == "sqlserver" else SYN,), "fetchone") is not None
                    # Set before CREATE: MySQL commits DDL at once, so a stop between CREATE and return must still drop it.
                    s.created = not ex
                    if not ex:
                        open(D + "/table", "w").close()  # StopHarness fails while this is left
                    for x in {"postgres": ["CREATE TABLE IF NOT EXISTS {t} (id INTEGER PRIMARY KEY)",
                                           "INSERT INTO {t} (id) VALUES (1) ON CONFLICT (id) DO NOTHING"],
                              "mysql": ["CREATE TABLE IF NOT EXISTS {t} (id INT PRIMARY KEY) ENGINE=InnoDB",
                                        "INSERT IGNORE INTO {t} (id) VALUES (1)"],
                              "sqlserver": ["IF OBJECT_ID('dbo.{t}', 'U') IS NULL CREATE TABLE dbo.{t} (id INT PRIMARY KEY)",
                                            "IF NOT EXISTS (SELECT 1 FROM dbo.{t} WHERE id = 1) INSERT INTO dbo.{t} (id) VALUES (1)"]}[s.e]:
                        s.sql(conn, x.format(t=SYN))
                    conn.commit()

                def drop_table(s):
                    try:
                        conn = s.connect()
                    except BaseException as x:
                        print("ERROR: cleanup connection failed: %r" % (x,))
                        return False
                    try:
                        # Short lock timeout so the drop can't wait on another session's locks.
                        s.sql(conn, {"postgres": "SET lock_timeout = '5s'", "mysql": "SET SESSION lock_wait_timeout = 5",
                                     "sqlserver": "SET LOCK_TIMEOUT 5000"}[s.e])
                        s.sql(conn, "IF OBJECT_ID('dbo.{t}', 'U') IS NOT NULL DROP TABLE dbo.{t}".format(t=SYN)
                              if s.e == "sqlserver" else "DROP TABLE IF EXISTS " + SYN)
                        conn.commit()
                        print("Dropped " + SYN)
                        _quiet(lambda: os.remove(D + "/table"))
                        return True
                    except BaseException as x:
                        print("ERROR: could not drop %s; it is left in the database: %s: %s" % (SYN, type(x).__name__, x))
                        return False
                    finally:
                        _quiet(conn.close)

                def prepare_synthetic(s):
                    c = s.connect()
                    try:
                        s.ensure_table(c)
                    except Exception as x:
                        die(6, "ensure_table failed for %s: %s: %s" % (SYN, type(x).__name__, x))
                    finally:
                        _quiet(c.close)
                    print(("Created %s (will DROP on cleanup)" if s.created else "Reusing %s (will NOT drop on cleanup)") % SYN)
                    return ("[dbo].[%s]" % SYN if s.e == "sqlserver" else q(s.e, SYN)), ["id"], (1,)

                def prepare_real(s):
                    # Only SELECT statements on the user's table.
                    if s.e == "sqlserver":
                        sch, t = s.table.split(".", 1) if "." in s.table else ("dbo", s.table)
                        ref = q(s.e, sch) + "." + q(s.e, t)
                    else:
                        sch, t, ref = None, s.table, q(s.e, s.table)
                    print("Real_Mode: %s (%s)" % (ref, s.e))
                    c = s.connect()
                    try:
                        start = time.monotonic()
                        try:
                            s.sql(c, "SELECT 1 FROM %s WHERE 1=0" % ref, fetch="fetchall")
                        except Exception as x:
                            m = str(x).lower()
                            gone = {"postgres": "does not exist" in m, "mysql": "doesn't exist" in m or "does not exist" in m,
                                    "sqlserver": "invalid object name" in m}[s.e]
                            die(20 if gone else 24, "table %s missing or not readable in db %s (engine=%s): %s: %s"
                                % (ref, s.db, s.e, type(x).__name__, x))
                        try:
                            row = s.sql(c, ("SELECT TOP 1 1 FROM %s" if s.e == "sqlserver" else "SELECT 1 FROM %s LIMIT 1") % ref,
                                        fetch="fetchone")
                        except Exception as x:
                            die(24, "probe failed for %s: %s: %s" % (ref, type(x).__name__, x))
                        if row is None:
                            die(21, "table %s empty; cannot select row" % ref)
                        if time.monotonic() - start > 10:
                            die(22, "pre-flight on %s took over 10 s" % ref)
                        if s.e == "sqlserver":
                            pk_sql, args = ("SELECT c.name FROM sys.indexes i JOIN sys.index_columns ic ON i.object_id = ic.object_id"
                                            " AND i.index_id = ic.index_id JOIN sys.columns c ON ic.object_id = c.object_id"
                                            " AND ic.column_id = c.column_id WHERE i.is_primary_key = 1 AND i.object_id = OBJECT_ID(?)"
                                            " ORDER BY ic.key_ordinal", (sch + "." + t,))
                        else:
                            pk_sql, args = ("SELECT kcu.column_name FROM information_schema.table_constraints tc"
                                            " JOIN information_schema.key_column_usage kcu ON tc.constraint_schema = kcu.constraint_schema"
                                            " AND tc.constraint_name = kcu.constraint_name AND tc.table_schema = kcu.table_schema"
                                            " AND tc.table_name = kcu.table_name WHERE tc.constraint_type = 'PRIMARY KEY'"
                                            " AND tc.table_name = %s" + (" AND tc.table_schema = DATABASE()" if s.e == "mysql" else "")
                                            + " ORDER BY kcu.ordinal_position", (t,))
                        try:
                            pk = [str(r[0]) for r in s.sql(c, pk_sql, args, "fetchall")]
                        except Exception as x:
                            die(24, "PK introspection failed for %s: %s: %s. Check that %s can read the catalog views."
                                % (ref, type(x).__name__, x, s.user))
                        if not pk:
                            die(23, "table %s has no PK; Real_Mode requires one" % ref)
                        cols = ", ".join(q(s.e, x) for x in pk)
                        try:
                            row = s.sql(c, ("SELECT TOP 1 {c} FROM {r} ORDER BY {c} ASC" if s.e == "sqlserver" else
                                            "SELECT {c} FROM {r} ORDER BY {c} ASC LIMIT 1").format(c=cols, r=ref), fetch="fetchone")
                        except Exception as x:
                            die(24, "target-row select failed for %s: %s: %s" % (ref, type(x).__name__, x))
                        if row is None:
                            die(21, "table %s empty; cannot select row" % ref)
                    finally:
                        _quiet(c.close)
                    print("PK columns: %s" % (pk,))
                    print("Locking pk_values=%r" % (tuple(row),))
                    return ref, pk, tuple(row)

                def waiter(s, i, lock, pk):
                    try:
                        conn = s.connect()
                    except SystemExit:
                        return
                    except Exception as x:
                        print("W%d connect fail: %s: %s" % (i, type(x).__name__, x))
                        return
                    s.connected.append(i)
                    try:
                        cur = conn.cursor()
                        try:
                            # Wait for the whole hold, whatever the server's default wait limits.
                            cur.execute({"postgres": "SET lock_timeout = 0; SET statement_timeout = 0",
                                         "mysql": "SET SESSION innodb_lock_wait_timeout = %d, max_execution_time = 0"
                                         % (s.dur + 600), "sqlserver": "SET LOCK_TIMEOUT -1"}[s.e])
                            if s.released:
                                s.late.append(i)  # this Waiter can't wait on the Blocker
                            cur.execute(lock, pk)
                            _quiet(cur.fetchall)
                            conn.commit()
                        except Exception as x:
                            print("W%d locking SELECT/COMMIT fail: %s: %s" % (i, type(x).__name__, x))
                            if not s.released:
                                s.early.append(i)
                            _quiet(conn.rollback)
                        finally:
                            _quiet(cur.close)
                    finally:
                        _quiet(conn.close)

                def ramp_waiters(s, schedule, lock, pk):
                    try:
                        i = 0
                        for k, (wait, m) in enumerate(schedule, 1):
                            time.sleep(wait)
                            for _ in range(m):
                                i += 1
                                t = threading.Thread(target=s.waiter, args=(i, lock, pk), daemon=True)
                                t.start()
                                s.threads.append(t)
                            print("Ramp %d/%d: +%d waiter(s), total=%d/%d" % (k, len(schedule), m, i, s.n))
                    except Exception as x:
                        print("Ramp failed: %s: %s" % (type(x).__name__, x))

                def ended(s, start, x):
                    s.ended_early = True
                    print("ERROR: Blocker tx ended by the server after %ds (engine=%s), before ExperimentDuration; check the"
                          " engine's session and transaction timeouts. %s: %s" % (time.monotonic() - start, s.e, type(x).__name__, x))

                def run(s):
                    print("=== Blocking Locks Harness === Engine: %s Endpoint: %s:%d Database: %s User: %s"
                          % (s.e, s.ep, s.port, s.db, s.user))
                    print("Mode: %s TargetTableName: %s" % ("Real_Mode" if s.real else "Synthetic_Mode", s.table))
                    print("Waiters=%d Duration=%ds Ramp=%ds Steps=%d" % (s.n, s.dur, s.ramp, s.steps))
                    ref, cols, pk = s.prepare_real() if s.real else s.prepare_synthetic()
                    lock = lock_query(s.e, ref, cols)
                    print("Lock SQL: " + lock)
                    if s.ramp > s.dur:
                        print("NOTE: RampTime %ds > Duration %ds; clamping." % (s.ramp, s.dur))
                    schedule = ramp_schedule(s.n, s.steps, s.ramp, s.dur)
                    print("Ramp schedule: %s" % (schedule,))
                    ramp = threading.Thread(target=s.ramp_waiters, args=(schedule, lock, pk), daemon=True)
                    bc = s.connect()
                    try:
                        try:
                            # Refuse, rather than queue, when another run or session already holds the row.
                            s.sql(bc, {"postgres": "SET lock_timeout = '5s'", "mysql": "SET SESSION innodb_lock_wait_timeout = 5",
                                       "sqlserver": "SET LOCK_TIMEOUT 5000"}[s.e])
                            got = s.sql(bc, lock, pk, "fetchall")
                        except Exception as x:
                            _quiet(bc.rollback)
                            die(25 if s.real else 5, "blocker lock failed on %s pk=%r (engine=%s; is the row locked by another"
                                " run or session?): %s: %s" % (ref, pk, s.e, type(x).__name__, x))
                        if not got:
                            die(25 if s.real else 5, "blocker lock failed on %s pk=%r; row deleted before lock acquired" % (ref, pk))
                        start = time.monotonic()
                        print("Blocker locked %s pk=%r; holding %ds" % (ref, pk, s.dur))
                        ramp.start()
                        errs, end = s.closed_errors(), start + s.dur
                        while True:
                            left = end - time.monotonic()
                            if left <= 0:
                                break
                            time.sleep(min(15, left))
                            try:
                                s.sql(bc, "SELECT 1", fetch="fetchall")
                            except errs as x:
                                s.ended(start, x)
                                break
                        if not s.ended_early:
                            try:
                                s.released = True
                                bc.commit()
                                print("Blocker COMMIT; %s pk=%r released after %ds" % (ref, pk, s.dur))
                            except Exception as x:
                                s.ended(start, x)
                    finally:
                        s.released = True
                        _quiet(bc.close)
                    ramp.join(timeout=60)
                    print("Joining %d waiter threads..." % len(s.threads))
                    end = time.monotonic() + 60  # one bound for all the joins
                    for t in s.threads:
                        t.join(timeout=max(0, end - time.monotonic()))
                    alive = sum(t.is_alive() for t in s.threads)
                    print("WARN: %d waiter(s) still alive after 60 s" % alive if alive else "Waiters joined")
                    print("Waiters connected: %d of %d" % (len(s.connected), s.n))
                    if s.ended_early:
                        sys.exit(11)
                    if s.early:
                        die(14, "Waiters %s ended before the Blocker released" % (s.early,))
                    if len(s.connected) < s.n:
                        die(12, "only %d of %d Waiters connected" % (len(s.connected), s.n))
                    if s.late:
                        die(15, "Waiters %s started after the Blocker released; start the last ramp step before the hold ends"
                            % (s.late,))

            def _int(name, v):
                if not v.isdigit():
                    die(1, "%s must be a non-negative integer, got %r" % (name, v))
                return int(v)

            def _dur(v):
                h, m, x = (int(g or 0) for g in re.match(r"PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$", v).groups())
                return h * 3600 + m * 60 + x

            def _term(signum, frame):
                # SIGTERM (StopHarness) -> SystemExit runs the finally blocks: close the Blocker connection (releasing
                # the lock) and drop the table. One-shot, so a second SIGTERM can't cut that cleanup short.
                signal.signal(signal.SIGTERM, signal.SIG_IGN)
                raise SystemExit(128 + signum)

            def main():
                signal.signal(signal.SIGTERM, _term)
                if len(sys.argv) != 13:
                    die(1, "usage: harness.py ENGINE ENDPOINT PORT DBNAME USER SECRET_ARN WAITERS DURATION RAMP_TIME RAMP_STEPS"
                        " REGION TARGET_TABLE")
                _, e, ep, port, db, user, arn, n, dur, ramp, steps, region, table = sys.argv
                if e not in ("postgres", "mysql", "sqlserver"):
                    die(4, "unsupported DatabaseEngine %r" % e)
                port, n, steps, dur, ramp = _int("DatabasePort", port), _int("WaiterCount", n), _int("RampSteps", steps), _dur(dur), _dur(ramp)
                if not 0 < dur <= 7200:
                    die(1, "ExperimentDuration must be more than 0 and at most PT2H")
                if n < 1:
                    die(1, "WaiterCount must be at least 1")
                h = Harness(e, ep, port, db, user, get_password(arn, region), n, dur, ramp, steps, table)
                code = 0
                try:
                    h.run()
                except SystemExit:
                    raise
                except Exception:
                    sys.stderr.write("ERROR: Harness raised an uncaught exception:\n")
                    traceback.print_exc()
                    code = 10
                finally:
                    signal.signal(signal.SIGTERM, signal.SIG_IGN)  # a SIGTERM must not cut the drop short
                    if h.created and not h.drop_table():
                        sys.exit(13)
                sys.exit(code)

            if __name__ == "__main__":
                main()
            PYTHON_EOF
            # A harness not started by the time StopHarness creates "stop" never starts.
            [ ! -e "$D/stop" ] || { echo "ERROR: stopped before the harness started"; exit 1; }
            # Own session, so a cancel that ends the command's process group doesn't reach it.
            setsid -w python3 "$D/harness.py" "{{ DatabaseEngine }}" "{{ DatabaseEndpoint }}" "{{ DatabasePort }}" \
              "{{ DatabaseName }}" "{{ DatabaseUser }}" "{{ DatabasePasswordSecretArn }}" "{{ WaiterCount }}" \
              "{{ ExperimentDuration }}" "{{ RampTime }}" "{{ RampSteps }}" "{{ global:REGION }}" "{{ TargetTableName }}"

  - name: StopHarness
    action: 'aws:runCommand'
    timeoutSeconds: 90
    onFailure: 'step:Cleanup'
    onCancel: 'step:CleanupOnCancel'
    inputs:
      DocumentName: 'AWS-RunShellScript'
      InstanceIds:
        - '{{ LaunchLoadGenerator.InstanceId }}'
      Parameters:
        executionTimeout: '60'
        commands:
          - |
            #!/bin/bash
            # Stop the harness while the network is up so its DB connections close and the lock releases;
            # terminating the instance instead strands them until the server keepalive (~6 min).
            D=/var/lib/fis-blocking-locks
            # "stop" first: a harness that writes its record after this sees it and exits; one that wrote it before is found.
            install -d -m 0700 -o root -g root $D && touch $D/stop || { echo "ERROR: cannot create $D/stop"; exit 1; }
            alive() { [ -n "$S" ] && [ "$(cut -d' ' -f22 "/proc/$P/stat" 2>/dev/null)" = "$S" ]; }
            P= S=; [ -f $D/pid ] && read -r P S < $D/pid
            if alive; then
              kill -TERM "$P"
              for i in $(seq 25); do alive || break; sleep 1; done
              alive && { kill -KILL "$P"; echo "ERROR: harness killed after 25s"; F=1; } || echo "stopped after SIGTERM"
            fi
            [ -f $D/table ] && { echo "ERROR: fis_blocking_locks_target was created and not dropped; drop it by hand"; exit 1; }
            exit ${F:-0}

  - name: Cleanup
    action: 'aws:executeScript'
    timeoutSeconds: 600
    isEnd: true
    onFailure: 'Abort'
    onCancel: 'step:CleanupOnCancel'
    inputs:
      Runtime: python3.11
      Handler: h
      Script: |
        import time, boto3
        from botocore.exceptions import ClientError

        # Finds this run's group by name and instance by tag, never from another step's outputs.
        def h(e, c):
            ec2, x, db, p = boto3.client('ec2'), e['Id'], e['Db'], int(e['Port'])
            end = time.time() + int(e['Wait'])
            gs = [g['GroupId'] for g in ec2.describe_security_groups(Filters=[
                {'Name': 'group-name', 'Values': ['FIS-DatabaseBlockingLocks-LoadGen-' + x]}])['SecurityGroups']]
            def revoke(lg):
                try:
                    ec2.revoke_security_group_ingress(GroupId=db, IpPermissions=[{
                        'IpProtocol': 'tcp', 'FromPort': p, 'ToPort': p, 'UserIdGroupPairs': [{'GroupId': lg}]}])
                except ClientError as y:
                    if y.response['Error']['Code'] != 'InvalidPermission.NotFound':
                        raise
            for lg in gs:
                revoke(lg)
            f = [{'Name': 'tag:FIS-Execution', 'Values': [x]}]
            while True:
                ids = [i['InstanceId'] for pg in ec2.get_paginator('describe_instances').paginate(Filters=f)
                       for r in pg['Reservations'] for i in r['Instances'] if i['State']['Name'] != 'terminated']
                if not ids or time.time() > end:
                    break
                ec2.terminate_instances(InstanceIds=ids)
                time.sleep(10)
            if ids:
                raise Exception('%s not terminated yet (it shuts down 210 min after launch); delete %s by hand' % (ids, gs))
            # A cancelled AuthorizeInboundFromLoadGenerator can add the rule after the first revoke, so on a
            # DependencyViolation revoke again before retrying the delete.
            for lg in gs:
                while True:
                    try:
                        ec2.delete_security_group(GroupId=lg)
                        break
                    except ClientError as y:
                        if y.response['Error']['Code'] == 'InvalidGroup.NotFound':
                            break
                        if y.response['Error']['Code'] != 'DependencyViolation' or time.time() > end:
                            raise
                        revoke(lg)
                        time.sleep(10)
            # A rule the cancelled step added after the group was deleted still names it: revoke once more,
            # then fail naming any rule still on the database group.
            for lg in gs:
                revoke(lg)
            g = ec2.describe_security_groups(GroupIds=[db])['SecurityGroups'][0]
            left = [lg for lg in gs if any(u.get('GroupId') == lg
                    for r in g['IpPermissions'] for u in r.get('UserIdGroupPairs', []))]
            if left:
                raise Exception('Ingress rule from %s is still on %s; remove it by hand' % (left, db))
      InputPayload:
        Id: '{{ automation:EXECUTION_ID }}'
        Db: '{{ DatabaseSecurityGroupId }}'
        Port: '{{ DatabasePort }}'
        Wait: '480'

  - name: CleanupOnCancel
    action: 'aws:executeScript'
    timeoutSeconds: 600
    isEnd: true
    onFailure: 'Abort'
    onCancel: 'Abort'
    inputs:
      Runtime: python3.11
      Handler: h
      Script: |
