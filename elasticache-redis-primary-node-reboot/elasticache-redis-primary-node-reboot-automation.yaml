  - name: reportAfterFailure
    action: aws:executeScript
    timeoutSeconds: 60
    isCritical: true
    onCancel: step:reportAfterStop
    isEnd: true
    inputs:
      Runtime: python3.11
      Handler: report
      # The script below is the same in reportAfterFailure and reportAfterStop. Change both together.
      Script: |
        import time

        import boto3
        from botocore.config import Config

        # Few retries and short timeouts: on a stop, this step has to finish inside the two-minute cancel
        # window, and a call that starts just before the deadline must still end inside the 60-s step.
        CONFIG = Config(retries={"max_attempts": 3, "mode": "standard"}, connect_timeout=3, read_timeout=5)


        def tagged_groups(ec, key, value, deadline):
            # Returns the tagged groups found and whether every group in the Region was read before the deadline.
            groups = []
            for page in ec.get_paginator("describe_replication_groups").paginate():
                for rg in page["ReplicationGroups"]:
                    if time.time() > deadline:
                        return groups, False
                    tags = ec.list_tags_for_resource(ResourceName=rg["ARN"]).get("TagList", [])
                    if any(t["Key"] == key and t["Value"] == value for t in tags):
                        groups.append(rg["ReplicationGroupId"])
            return groups, True


        def problems(ec, rg_id):
            g = ec.describe_replication_groups(ReplicationGroupId=rg_id)["ReplicationGroups"][0]
            out = []
            if g["Status"] != "available":
                out.append("group status " + g["Status"])
            for ng in g.get("NodeGroups", []):
                n = sum(1 for m in ng.get("NodeGroupMembers", []) if m.get("CurrentRole") == "primary")
                if n != 1:
                    out.append("node group {} has {} primaries".format(ng["NodeGroupId"], n))
            for cid in g.get("MemberClusters", []):
                c = ec.describe_cache_clusters(CacheClusterId=cid, ShowCacheNodeInfo=True)["CacheClusters"][0]
                if c["CacheClusterStatus"] != "available":
                    out.append("cluster {} status {}".format(cid, c["CacheClusterStatus"]))
                for node in c.get("CacheNodes", []):
                    if node["CacheNodeStatus"] != "available":
                        out.append("cluster {} node {} status {}".format(cid, node["CacheNodeId"], node["CacheNodeStatus"]))
            return out


        def report(events, context):
            ec = boto3.client("elasticache", region_name=events["region"], config=CONFIG)
            # One deadline for finding the groups and checking them.
            deadline = time.time() + int(events["timeoutSeconds"])
            groups, listed_all = tagged_groups(ec, events["tagKey"], events["tagValue"], deadline)
            scope = "" if listed_all else (" Only part of the Region's replication groups could be read before the "
                                           "deadline, so other tagged groups may not be included.")
            healthy_since = None
            while True:
                bad, unchecked = {}, []
                for rg_id in groups:
                    if time.time() > deadline:
                        unchecked.append(rg_id)
                        continue
                    issues = problems(ec, rg_id)
                    if issues:
                        bad[rg_id] = issues
                if bad or unchecked:
                    healthy_since = None
                elif healthy_since is None:
                    healthy_since = time.time()
                if not groups:
                    message = "No replication group found with tag {}={}.{}".format(
                        events["tagKey"], events["tagValue"], scope)
                    break
                if (healthy_since is not None and time.time() - healthy_since >= 20) or (
                        not bad and not unchecked and time.time() > deadline):
                    message = "Every tagged replication group found is healthy: {}.{}".format(", ".join(groups), scope)
                    break
                if time.time() > deadline:
                    message = ("Not healthy yet: {}. Not checked before the deadline: {}. A reboot that ElastiCache "
                               "has accepted can't be cancelled: the node restarts on its own, and its data is "
                               "cleared.{}".format(bad, unchecked, scope))
                    break
                time.sleep(5)
            print(message)
            if events["failRun"] == "true":
                raise Exception("A step failed (see its error). " + message)
            return {"Status": message}
      InputPayload:
        region: "{{ global:REGION }}"
        tagKey: "{{ tagKey }}"
        tagValue: "{{ tagValue }}"
        timeoutSeconds: "25"
        failRun: "true"
    outputs:
      - Name: Status
        Selector: $.Payload.Status
        Type: String
    description: "Runs only if a step fails: report whether every tagged group is healthy, then fail the run"

  - name: reportAfterStop
    action: aws:executeScript
    timeoutSeconds: 60
    isCritical: true
    isEnd: true
    inputs:
      Runtime: python3.11
      Handler: report
      # The script below is the same in reportAfterFailure and reportAfterStop. Change both together.
      Script: |
        import time

        import boto3
        from botocore.config import Config

        # Few retries and short timeouts: on a stop, this step has to finish inside the two-minute cancel
        # window, and a call that starts just before the deadline must still end inside the 60-s step.
        CONFIG = Config(retries={"max_attempts": 3, "mode": "standard"}, connect_timeout=3, read_timeout=5)


        def tagged_groups(ec, key, value, deadline):
            # Returns the tagged groups found and whether every group in the Region was read before the deadline.
            groups = []
            for page in ec.get_paginator("describe_replication_groups").paginate():
                for rg in page["ReplicationGroups"]:
                    if time.time() > deadline:
                        return groups, False
                    tags = ec.list_tags_for_resource(ResourceName=rg["ARN"]).get("TagList", [])
                    if any(t["Key"] == key and t["Value"] == value for t in tags):
                        groups.append(rg["ReplicationGroupId"])
            return groups, True


        def problems(ec, rg_id):
            g = ec.describe_replication_groups(ReplicationGroupId=rg_id)["ReplicationGroups"][0]
            out = []
            if g["Status"] != "available":
                out.append("group status " + g["Status"])
            for ng in g.get("NodeGroups", []):
                n = sum(1 for m in ng.get("NodeGroupMembers", []) if m.get("CurrentRole") == "primary")
                if n != 1:
                    out.append("node group {} has {} primaries".format(ng["NodeGroupId"], n))
            for cid in g.get("MemberClusters", []):
                c = ec.describe_cache_clusters(CacheClusterId=cid, ShowCacheNodeInfo=True)["CacheClusters"][0]
                if c["CacheClusterStatus"] != "available":
                    out.append("cluster {} status {}".format(cid, c["CacheClusterStatus"]))
                for node in c.get("CacheNodes", []):
                    if node["CacheNodeStatus"] != "available":
                        out.append("cluster {} node {} status {}".format(cid, node["CacheNodeId"], node["CacheNodeStatus"]))
            return out


        def report(events, context):
            ec = boto3.client("elasticache", region_name=events["region"], config=CONFIG)
            # One deadline for finding the groups and checking them.
            deadline = time.time() + int(events["timeoutSeconds"])
            groups, listed_all = tagged_groups(ec, events["tagKey"], events["tagValue"], deadline)
            scope = "" if listed_all else (" Only part of the Region's replication groups could be read before the "
                                           "deadline, so other tagged groups may not be included.")
            healthy_since = None
            while True:
                bad, unchecked = {}, []
                for rg_id in groups:
                    if time.time() > deadline:
                        unchecked.append(rg_id)
                        continue
                    issues = problems(ec, rg_id)
                    if issues:
                        bad[rg_id] = issues
                if bad or unchecked:
                    healthy_since = None
                elif healthy_since is None:
                    healthy_since = time.time()
                if not groups:
                    message = "No replication group found with tag {}={}.{}".format(
                        events["tagKey"], events["tagValue"], scope)
                    break
                if (healthy_since is not None and time.time() - healthy_since >= 20) or (
                        not bad and not unchecked and time.time() > deadline):
                    message = "Every tagged replication group found is healthy: {}.{}".format(", ".join(groups), scope)
                    break
                if time.time() > deadline:
                    message = ("Not healthy yet: {}. Not checked before the deadline: {}. A reboot that ElastiCache "
                               "has accepted can't be cancelled: the node restarts on its own, and its data is "
                               "cleared.{}".format(bad, unchecked, scope))
                    break
                time.sleep(5)
            print(message)
            if events["failRun"] == "true":
                raise Exception("A step failed (see its error). " + message)
            return {"Status": message}
      InputPayload:
        region: "{{ global:REGION }}"
        tagKey: "{{ tagKey }}"
        tagValue: "{{ tagValue }}"
        timeoutSeconds: "25"
        failRun: "false"
    outputs:
      - Name: Status
        Selector: $.Payload.Status
        Type: String
    description: "Runs only if the experiment is stopped: report whether every tagged group is healthy"
