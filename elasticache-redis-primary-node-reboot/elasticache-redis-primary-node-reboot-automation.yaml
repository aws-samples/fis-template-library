description: "Reboot the primary node of each ElastiCache (Redis OSS, cluster mode disabled) replication group that carries the given tag, and wait until ElastiCache reports the node restarted and available again. Rebooting a primary clears its data."
schemaVersion: "0.3"
assumeRole: "{{ AutomationAssumeRole }}"
parameters:
  tagKey:
    type: String
    description: "Tag key to identify ElastiCache replication groups to target"
    default: "FIS-Ready"
  tagValue:
    type: String
    description: "Tag value to identify ElastiCache replication groups to target"
    default: "True"
  AutomationAssumeRole:
    type: String
    description: "IAM role for the automation execution"
    default: ""

mainSteps:
  - name: rebootPrimaryNode
    action: aws:executeScript
    timeoutSeconds: 120
    onFailure: step:verifyHealthy
    onCancel: step:verifyHealthy
    inputs:
      Runtime: python3.11
      Handler: reboot_primary
      Script: |
        import boto3
        from datetime import datetime, timedelta, timezone


        def tagged_groups(ec, key, value):
            groups = []
            for page in ec.get_paginator("describe_replication_groups").paginate():
                for rg in page["ReplicationGroups"]:
                    tags = ec.list_tags_for_resource(ResourceName=rg["ARN"]).get("TagList", [])
                    if any(t["Key"] == key and t["Value"] == value for t in tags):
                        groups.append(rg)
            return groups


        def reboot_primary(events, context):
            ec = boto3.client("elasticache", region_name=events["region"])
            start = (datetime.now(timezone.utc) - timedelta(seconds=10)).isoformat()
            groups = tagged_groups(ec, events["tagKey"], events["tagValue"])
            if not groups:
                raise Exception("No replication group found with tag {}={}".format(events["tagKey"], events["tagValue"]))
            not_ready = []
            for g in groups:
                if g["Status"] != "available" or g.get("AutomaticFailover") != "enabled" or g.get("ClusterEnabled"):
                    not_ready.append("{} (status {}, AutomaticFailover {}, cluster mode {})".format(
                        g["ReplicationGroupId"], g["Status"], g.get("AutomaticFailover"),
                        "enabled" if g.get("ClusterEnabled") else "disabled"))
            if not_ready:
                raise Exception("Tagged replication groups not ready for a primary reboot (needs status available, "
                                "AutomaticFailover enabled and cluster mode disabled): " + ", ".join(not_ready))
            targets = []
            for g in groups:
                primaries = [m for m in g["NodeGroups"][0]["NodeGroupMembers"] if m.get("CurrentRole") == "primary"]
                if len(primaries) != 1:
                    raise Exception("{} has {} primary nodes".format(g["ReplicationGroupId"], len(primaries)))
                targets.append((g["ReplicationGroupId"], primaries[0]["CacheClusterId"], primaries[0]["CacheNodeId"]))
            for rg_id, cluster_id, node_id in targets:
                ec.reboot_cache_cluster(CacheClusterId=cluster_id, CacheNodeIdsToReboot=[node_id])
                print("RebootCacheCluster called for primary {} node {} of {}".format(cluster_id, node_id, rg_id))
            return {"RebootedNodes": ",".join("{}:{}".format(c, n) for _, c, n in targets), "StartTime": start}
      InputPayload:
        region: "{{ global:REGION }}"
        tagKey: "{{ tagKey }}"
        tagValue: "{{ tagValue }}"
    outputs:
      - Name: RebootedNodes
        Selector: $.Payload.RebootedNodes
        Type: String
      - Name: StartTime
        Selector: $.Payload.StartTime
        Type: String
    description: "Reboot the primary node of each tagged replication group"

  - name: waitForReboot
    action: aws:executeScript
    timeoutSeconds: 570
    onFailure: step:verifyHealthy
    onCancel: step:verifyHealthy
    inputs:
      Runtime: python3.11
      Handler: wait_for_reboot
      Script: |
        import time
        from datetime import datetime

        import boto3


        def reboot_state(ec, cluster_id, node_id, since):
            messages = [e["Message"] for e in ec.describe_events(
                SourceIdentifier=cluster_id, SourceType="cache-cluster", StartTime=since)["Events"]]
            restarted = any("Cache node {} restarted".format(node_id) in m for m in messages)
            c = ec.describe_cache_clusters(CacheClusterId=cluster_id, ShowCacheNodeInfo=True)["CacheClusters"][0]
            nodes = [n["CacheNodeStatus"] for n in c.get("CacheNodes", []) if n["CacheNodeId"] == node_id]
            if not restarted:
                return "node not restarted yet (cluster status {}, node status {})".format(c["CacheClusterStatus"], nodes)
            if c["CacheClusterStatus"] != "available" or nodes != ["available"]:
                return "node restarted, cluster status {}, node status {}".format(c["CacheClusterStatus"], nodes)
            g = ec.describe_replication_groups(ReplicationGroupId=c["ReplicationGroupId"])["ReplicationGroups"][0]
            if g["Status"] != "available":
                return "node available, group status " + g["Status"]
            return None


        def wait_for_reboot(events, context):
            ec = boto3.client("elasticache", region_name=events["region"])
            since = datetime.fromisoformat(events["startTime"])
            nodes = [x.split(":") for x in events["rebootedNodes"].split(",") if x]
            deadline = time.time() + int(events["timeoutSeconds"])
            while True:
                waiting = {}
                for cluster_id, node_id in nodes:
                    state = reboot_state(ec, cluster_id, node_id, since)
                    if state:
                        waiting[cluster_id] = state
                if not waiting:
                    print("Rebooted nodes restarted and available: " + events["rebootedNodes"])
                    return {"Status": "rebooted"}
                if time.time() > deadline:
                    if events["failIfNotDone"] == "true":
                        raise Exception("Reboot did not finish in time: " + str(waiting))
                    print("Still rebooting, continuing in the next step: " + str(waiting))
                    return {"Status": "still rebooting"}
                time.sleep(10)
      InputPayload:
        region: "{{ global:REGION }}"
        rebootedNodes: "{{ rebootPrimaryNode.RebootedNodes }}"
        startTime: "{{ rebootPrimaryNode.StartTime }}"
        timeoutSeconds: "540"
        failIfNotDone: "false"
    outputs:
      - Name: Status
        Selector: $.Payload.Status
        Type: String
    description: "Wait until ElastiCache reports the node restarted and the cluster, node and group are available"

  - name: waitForRebootContinued
    action: aws:executeScript
    timeoutSeconds: 570
    onFailure: step:verifyHealthy
    onCancel: step:verifyHealthy
    isEnd: true
    inputs:
      Runtime: python3.11
      Handler: wait_for_reboot
      Script: |
        import time
        from datetime import datetime

        import boto3


        def reboot_state(ec, cluster_id, node_id, since):
            messages = [e["Message"] for e in ec.describe_events(
                SourceIdentifier=cluster_id, SourceType="cache-cluster", StartTime=since)["Events"]]
            restarted = any("Cache node {} restarted".format(node_id) in m for m in messages)
            c = ec.describe_cache_clusters(CacheClusterId=cluster_id, ShowCacheNodeInfo=True)["CacheClusters"][0]
            nodes = [n["CacheNodeStatus"] for n in c.get("CacheNodes", []) if n["CacheNodeId"] == node_id]
            if not restarted:
                return "node not restarted yet (cluster status {}, node status {})".format(c["CacheClusterStatus"], nodes)
            if c["CacheClusterStatus"] != "available" or nodes != ["available"]:
                return "node restarted, cluster status {}, node status {}".format(c["CacheClusterStatus"], nodes)
            g = ec.describe_replication_groups(ReplicationGroupId=c["ReplicationGroupId"])["ReplicationGroups"][0]
            if g["Status"] != "available":
                return "node available, group status " + g["Status"]
            return None


        def wait_for_reboot(events, context):
            ec = boto3.client("elasticache", region_name=events["region"])
            since = datetime.fromisoformat(events["startTime"])
            nodes = [x.split(":") for x in events["rebootedNodes"].split(",") if x]
            deadline = time.time() + int(events["timeoutSeconds"])
            while True:
                waiting = {}
                for cluster_id, node_id in nodes:
                    state = reboot_state(ec, cluster_id, node_id, since)
                    if state:
                        waiting[cluster_id] = state
                if not waiting:
                    print("Rebooted nodes restarted and available: " + events["rebootedNodes"])
                    return {"Status": "rebooted"}
                if time.time() > deadline:
                    if events["failIfNotDone"] == "true":
                        raise Exception("Reboot did not finish in time: " + str(waiting))
                    print("Still rebooting, continuing in the next step: " + str(waiting))
                    return {"Status": "still rebooting"}
                time.sleep(10)
      InputPayload:
        region: "{{ global:REGION }}"
        rebootedNodes: "{{ rebootPrimaryNode.RebootedNodes }}"
        startTime: "{{ rebootPrimaryNode.StartTime }}"
        timeoutSeconds: "540"
        failIfNotDone: "true"
    outputs:
      - Name: Status
        Selector: $.Payload.Status
        Type: String
    description: "Continue the wait (an aws:executeScript step runs for at most 10 minutes)"

  - name: verifyHealthy
    action: aws:executeScript
    timeoutSeconds: 110
    isEnd: true
    inputs:
      Runtime: python3.11
      Handler: verify_healthy
      Script: |
        import time

        import boto3


        def tagged_groups(ec, key, value):
            groups = []
            for page in ec.get_paginator("describe_replication_groups").paginate():
                for rg in page["ReplicationGroups"]:
                    tags = ec.list_tags_for_resource(ResourceName=rg["ARN"]).get("TagList", [])
                    if any(t["Key"] == key and t["Value"] == value for t in tags):
                        groups.append(rg)
            return groups


        def problems(ec, g):
            out = []
            if g["Status"] != "available":
                out.append("group status " + g["Status"])
            for ng in g["NodeGroups"]:
                n = sum(1 for m in ng["NodeGroupMembers"] if m.get("CurrentRole") == "primary")
                if n != 1:
                    out.append("node group {} has {} primaries".format(ng["NodeGroupId"], n))
            for cid in g.get("MemberClusters", []):
                c = ec.describe_cache_clusters(CacheClusterId=cid, ShowCacheNodeInfo=True)["CacheClusters"][0]
                if c["CacheClusterStatus"] != "available":
                    out.append("cluster {} status {}".format(cid, c["CacheClusterStatus"]))
                for node in c.get("CacheNodes", []):
                    if node["CacheNodeStatus"] != "available":
                        out.append("cluster {} node {} status {}".format(cid, node["CacheNodeId"], node["CacheNodeStatus"]))
            return out


        def verify_healthy(events, context):
            ec = boto3.client("elasticache", region_name=events["region"])
            deadline = time.time() + int(events["timeoutSeconds"])
            healthy_since = None
            while True:
                bad = {}
                for g in tagged_groups(ec, events["tagKey"], events["tagValue"]):
                    issues = problems(ec, g)
                    if issues:
                        bad[g["ReplicationGroupId"]] = issues
                if bad:
                    healthy_since = None
                elif healthy_since is None:
                    healthy_since = time.time()
                if healthy_since is not None and time.time() - healthy_since >= 30:
                    print("All tagged replication groups are healthy")
                    return {"Status": "healthy"}
                if time.time() > deadline:
                    if not bad:
                        print("All tagged replication groups are healthy")
                        return {"Status": "healthy"}
                    message = ("Not healthy yet: " + str(bad) + ". A reboot that ElastiCache has accepted cannot be "
                               "cancelled: the node restarts on its own, and its data is cleared.")
                    print(message)
                    return {"Status": message}
                time.sleep(10)
      InputPayload:
        region: "{{ global:REGION }}"
        tagKey: "{{ tagKey }}"
        tagValue: "{{ tagValue }}"
        timeoutSeconds: "85"
    outputs:
      - Name: Status
        Selector: $.Payload.Status
        Type: String
    description: "Runs only if a step fails or the experiment is stopped: report whether every tagged group is healthy"
