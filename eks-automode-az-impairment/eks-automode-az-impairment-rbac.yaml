# Kubernetes RBAC for the SSM automation used by this experiment.
# Apply this to your cluster: kubectl apply -f eks-automode-az-impairment-rbac.yaml
#
# The permissions below are exactly what eks-automode-az-impairment-automation.yaml
# performs against the Kubernetes API:
#   - list nodes by zone label, and patch them to cordon/uncordon  (nodes: list, patch)
#   - list pods on those nodes, and delete them                    (pods: list, delete)
#   - read and patch the NodePool's zone requirements              (nodepools: get, patch)
#
# The subject is the username given to the SSM automation role in its EKS Access
# Entry (see the Prerequisites section of the README). Change `fis-ssm-automation`
# here if you used a different --username.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fis-az-impairment-cluster-role
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "delete"]
# EKS Auto Mode serves NodePools under eks.amazonaws.com; upstream Karpenter uses
# karpenter.sh. The automation tries both, so both are granted.
- apiGroups: ["karpenter.sh"]
  resources: ["nodepools"]
  verbs: ["get", "patch"]
- apiGroups: ["eks.amazonaws.com"]
  resources: ["nodepools"]
  verbs: ["get", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fis-az-impairment-cluster-rolebinding
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: fis-ssm-automation
roleRef:
  kind: ClusterRole
  name: fis-az-impairment-cluster-role
  apiGroup: rbac.authorization.k8s.io
