schemaVersion: '0.3'
description: |
  Impairs one Availability Zone for an EKS Auto Mode cluster from the Kubernetes
  side: cordons the nodes in the target AZ, patches a custom NodePool to exclude
  the AZ (and optionally raises its weight), and deletes the non-system pods on
  those nodes. After the wait it restores only what this run changed and removes
  every resource it created.

  The Kubernetes API calls run on a short-lived EC2 instance launched in a subnet
  inside the cluster VPC, so the automation works with a private EKS API
  endpoint. The automation adds a temporary tcp/443 rule from the instance's
  security group to the cluster security group, and removes it during cleanup.
assumeRole: '{{ AutomationAssumeRole }}'
parameters:
  AutomationAssumeRole:
    type: String
    description: ARN of the IAM role the automation runs as.
    default: ''
  ClusterName:
    type: String
    description: Name of the EKS Auto Mode cluster.
    allowedPattern: '^[0-9A-Za-z][A-Za-z0-9\-_]{0,99}$'
  TargetAZ:
    type: String
    description: Availability Zone to impair, for example us-east-1a.
    allowedPattern: '^[a-z]{2}(-[a-z]+)+-\d[a-z]$'
  NodePoolName:
    type: String
    description: >-
      Name of a custom NodePool to patch. The built-in general-purpose and
      system NodePools are rejected, because EKS Auto Mode reverts changes to
      them.
    allowedPattern: '^[a-z0-9]([-a-z0-9.]{0,251}[a-z0-9])?$'
  Duration:
    type: String
    description: >-
      How long the NodePool exclusion and cordons stay in place, in ISO 8601
      format. Set it so restore runs after the network disruption ends: with
      the template defaults, the zonal shift duration.
    default: 'PT14M'
    allowedPattern: '^PT(\d+H)?(\d+M)?(\d+S)?$'
  ImpairNodePoolWeight:
    type: String
    description: >-
      Weight to set on the custom NodePool while the AZ is impaired (1-100), so
      EKS Auto Mode prefers it over the built-in NodePools. 0 leaves the weight
      unchanged. The original value is restored afterwards.
    default: '100'
    allowedPattern: '^(100|[1-9]?[0-9])$'
  SubnetId:
    type: String
    description: >-
      Subnet for the temporary client instance. It must be in the cluster VPC,
      NOT in the target AZ, and able to reach the Systems Manager endpoints and
      the Amazon Linux package repositories (NAT gateway, or VPC endpoints for
      ssm, ssmmessages, ec2messages and an S3 gateway endpoint).
    allowedPattern: '^subnet-[0-9a-f]{8,17}$'
  VpcId:
    type: String
    description: ID of the cluster VPC.
    allowedPattern: '^vpc-[0-9a-f]{8,17}$'
  ClusterSecurityGroupId:
    type: String
    description: >-
      Security group that controls access to the private EKS API endpoint.
      Leave empty to use the cluster security group created by EKS.
    default: ''
    allowedPattern: '^$|^sg-[0-9a-f]{8,17}$'
  InstanceProfileName:
    type: String
    description: >-
      Instance profile for the temporary client instance. Its role is the
      identity that calls the Kubernetes API (EKS access entry and RBAC).
  InstanceType:
    type: String
    description: Instance type for the temporary client instance.
    default: 't3.small'
  LatestAmiId:
    type: String
    description: Amazon Linux 2023 AMI for the temporary client instance.
    default: '{{ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
mainSteps:
  - name: ValidateInputs
    description: Check the inputs against the cluster and VPC before creating anything.
    action: aws:executeScript
    nextStep: CreateSecurityGroup
    isEnd: false
    inputs:
      Runtime: python3.11
      Handler: validate_inputs
      InputPayload:
        ClusterName: '{{ ClusterName }}'
        TargetAZ: '{{ TargetAZ }}'
        NodePoolName: '{{ NodePoolName }}'
        SubnetId: '{{ SubnetId }}'
        VpcId: '{{ VpcId }}'
        ClusterSecurityGroupId: '{{ ClusterSecurityGroupId }}'
        ImpairNodePoolWeight: '{{ ImpairNodePoolWeight }}'
      Script: |
        import boto3

        BUILT_IN_NODEPOOLS = ('general-purpose', 'system')


        def validate_inputs(events, context):
            pool = events['NodePoolName']
            if pool in BUILT_IN_NODEPOOLS:
                raise ValueError(
                    f'NodePool {pool!r} is a built-in EKS Auto Mode NodePool. Auto Mode '
                    'reverts changes to built-in NodePools, so the AZ exclusion would '
                    'not hold. Use a custom NodePool.')
            weight = int(events['ImpairNodePoolWeight'])
            if not 0 <= weight <= 100:
                raise ValueError('ImpairNodePoolWeight must be between 0 and 100')

            eks = boto3.client('eks')
            cluster = eks.describe_cluster(name=events['ClusterName'])['cluster']
            if cluster['status'] != 'ACTIVE':
                raise ValueError(f"Cluster status is {cluster['status']}, expected ACTIVE")
            vpc_config = cluster['resourcesVpcConfig']
            if vpc_config['vpcId'] != events['VpcId']:
                raise ValueError(
                    f"VpcId {events['VpcId']} is not the cluster VPC {vpc_config['vpcId']}")
            if not vpc_config.get('endpointPrivateAccess'):
                raise ValueError(
                    'The cluster private endpoint is disabled. The client instance '
                    'reaches the Kubernetes API through the private endpoint. Enable '
                    'it with: aws eks update-cluster-config --name <cluster> '
                    '--resources-vpc-config endpointPrivateAccess=true')

            subnet = boto3.client('ec2').describe_subnets(
                SubnetIds=[events['SubnetId']])['Subnets'][0]
            if subnet['VpcId'] != events['VpcId']:
                raise ValueError(f"SubnetId {events['SubnetId']} is not in {events['VpcId']}")
            if subnet['AvailabilityZone'] == events['TargetAZ']:
                raise ValueError(
                    f"SubnetId {events['SubnetId']} is in the target AZ "
                    f"{events['TargetAZ']}. The network disruption would cut off the "
                    'client instance. Choose a subnet in another AZ.')

            cluster_sg = events['ClusterSecurityGroupId'] or vpc_config.get('clusterSecurityGroupId')
            if not cluster_sg:
                raise ValueError('Cluster has no cluster security group; set ClusterSecurityGroupId')
            return {
                'ClusterSecurityGroupId': cluster_sg,
                'ClientAvailabilityZone': subnet['AvailabilityZone'],
            }
    outputs:
      - Name: ClusterSecurityGroupId
        Selector: $.Payload.ClusterSecurityGroupId
        Type: String

  - name: CreateSecurityGroup
    description: Create a temporary security group for the client instance.
    action: aws:executeAwsApi
    nextStep: AuthorizeEKSAccess
    isEnd: false
    onFailure: step:CleanupResources
    onCancel: step:CleanupResources
    inputs:
      Service: ec2
      Api: CreateSecurityGroup
      GroupName: 'fis-eks-az-impairment-{{ automation:EXECUTION_ID }}'
      Description: Temporary client security group for the FIS EKS AZ impairment experiment
      VpcId: '{{ VpcId }}'
      TagSpecifications:
        - ResourceType: security-group
          Tags:
            - Key: Name
              Value: fis-eks-az-impairment-client
            - Key: ManagedBy
              Value: FIS-SSM-Automation
            - Key: FIS-Experiment
              Value: eks-automode-az-impairment
            - Key: FIS-AutomationExecutionId
              Value: '{{ automation:EXECUTION_ID }}'
    outputs:
      - Name: SecurityGroupId
        Selector: $.GroupId
        Type: String

  - name: AuthorizeEKSAccess
    description: Allow tcp/443 from the client security group to the cluster security group.
    action: aws:executeAwsApi
    nextStep: LaunchClientInstance
    isEnd: false
    onFailure: step:CleanupResources
    onCancel: step:CleanupResources
    inputs:
      Service: ec2
      Api: AuthorizeSecurityGroupIngress
      GroupId: '{{ ValidateInputs.ClusterSecurityGroupId }}'
      IpPermissions:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          UserIdGroupPairs:
            - GroupId: '{{ CreateSecurityGroup.SecurityGroupId }}'
              Description: 'FIS EKS AZ impairment client {{ automation:EXECUTION_ID }}'

  - name: LaunchClientInstance
    description: Launch the temporary client instance in SubnetId.
    action: aws:runInstances
    nextStep: WaitForSSMAgent
    isEnd: false
    onFailure: step:CleanupResources
    onCancel: step:CleanupResources
    inputs:
      ImageId: '{{ LatestAmiId }}'
      InstanceType: '{{ InstanceType }}'
      MinInstanceCount: 1
      MaxInstanceCount: 1
      SubnetId: '{{ SubnetId }}'
      SecurityGroupIds:
        - '{{ CreateSecurityGroup.SecurityGroupId }}'
      IamInstanceProfileName: '{{ InstanceProfileName }}'
      MetadataOptions:
        HttpTokens: required
      TagSpecifications:
        - ResourceType: instance
          Tags:
            - Key: Name
              Value: fis-eks-az-impairment-client
            - Key: ManagedBy
              Value: FIS-SSM-Automation
            - Key: FIS-Experiment
              Value: eks-automode-az-impairment
            - Key: FIS-AutomationExecutionId
              Value: '{{ automation:EXECUTION_ID }}'
    outputs:
      - Name: InstanceId
        Selector: $.InstanceIds[0]
        Type: String

  - name: WaitForSSMAgent
    description: Wait until the SSM Agent on the client instance is online.
    action: aws:waitForAwsResourceProperty
    timeoutSeconds: 600
    nextStep: BootstrapClient
    isEnd: false
    onFailure: step:CleanupResources
    onCancel: step:CleanupResources
    inputs:
      Service: ssm
      Api: DescribeInstanceInformation
      InstanceInformationFilterList:
        - key: InstanceIds
          valueSet:
            - '{{ LaunchClientInstance.InstanceId }}'
      PropertySelector: $.InstanceInformationList[0].PingStatus
      DesiredValues:
        - Online

  - name: BootstrapClient
    description: Install the Python modules and write the shared Kubernetes client library.
    action: aws:runCommand
    nextStep: ValidateEKSAccess
    isEnd: false
    onFailure: step:CleanupResources
    onCancel: step:CleanupResources
    inputs:
      DocumentName: AWS-RunShellScript
      InstanceIds:
        - '{{ LaunchClientInstance.InstanceId }}'
      CloudWatchOutputConfig:
        CloudWatchOutputEnabled: true
        CloudWatchLogGroupName: /aws/ssm/eks-automode-az-impairment
      Parameters:
        commands:
          - |
            #!/bin/bash
            set -euo pipefail
            if python3 -c 'import boto3, botocore, urllib3' >/dev/null 2>&1; then
              echo 'Python modules already installed'
            else
              echo 'Installing Python modules'
              dnf install -y python3-boto3 python3-urllib3 \
                || { dnf install -y python3-pip && python3 -m pip install --quiet boto3 urllib3; }
              python3 -c 'import boto3, botocore, urllib3'
              echo 'Python modules installed'
            fi
            mkdir -p /var/tmp/fis-az-impairment
            chmod 700 /var/tmp/fis-az-impairment
            cat > /var/tmp/fis-az-impairment/fisk8s.py <<'PYEOF'
            """Kubernetes API client shared by the experiment steps."""
            import base64
            import json
            import os
            import tempfile

            import boto3
            import urllib3
            from botocore.model import ServiceId
            from botocore.signers import RequestSigner
            from urllib3.util import Retry

            REGION = os.environ['AWS_DEFAULT_REGION']
            CLUSTER = os.environ['CLUSTER_NAME']
            STATE_FILE = '/var/tmp/fis-az-impairment/state.json'
            ZONE_KEY = 'topology.kubernetes.io/zone'
            NODEPOOL_PATH = '/apis/karpenter.sh/v1/nodepools/'
            SYSTEM_NAMESPACES = ('kube-system', 'kube-public', 'kube-node-lease')


            class Kube:
                def __init__(self):
                    self.session = boto3.Session(region_name=REGION)
                    self.cluster = self.session.client('eks').describe_cluster(name=CLUSTER)['cluster']
                    if self.cluster['status'] != 'ACTIVE':
                        raise RuntimeError(f"Cluster status is {self.cluster['status']}")
                    self.endpoint = self.cluster['endpoint']
                    ca = tempfile.NamedTemporaryFile(mode='wb', suffix='.crt', delete=False)
                    ca.write(base64.b64decode(self.cluster['certificateAuthority']['data'], validate=True))
                    ca.close()
                    # Retry connect failures only. The private endpoint has a network
                    # interface in each cluster subnet, including the impaired AZ, and
                    # urllib3 tries each resolved address in turn.
                    retry = Retry(total=4, connect=4, read=0, status=0, redirect=0,
                                  backoff_factor=1, raise_on_status=False)
                    self.http = urllib3.PoolManager(
                        cert_reqs='CERT_REQUIRED', ca_certs=ca.name,
                        timeout=urllib3.Timeout(connect=5, read=20), retries=retry)

                def _token(self):
                    signer = RequestSigner(ServiceId('sts'), REGION, 'sts', 'v4',
                                           self.session.get_credentials(), self.session.events)
                    params = {
                        'method': 'GET',
                        'url': f'https://sts.{REGION}.amazonaws.com/?Action=GetCallerIdentity&Version=2011-06-15',
                        'body': {}, 'headers': {'x-k8s-aws-id': CLUSTER}, 'context': {},
                    }
                    url = signer.generate_presigned_url(params, region_name=REGION,
                                                        expires_in=60, operation_name='')
                    return 'k8s-aws-v1.' + base64.urlsafe_b64encode(url.encode()).decode().rstrip('=')

                def call(self, method, path, body=None, content_type='application/json',
                         allowed=(200, 201, 202)):
                    headers = {'Authorization': 'Bearer ' + self._token(), 'Accept': 'application/json'}
                    data = None
                    if body is not None:
                        headers['Content-Type'] = content_type
                        data = json.dumps(body).encode()
                    resp = self.http.request(method, self.endpoint + path, headers=headers, body=data)
                    if resp.status not in allowed:
                        raise RuntimeError(f'{method} {path}: HTTP {resp.status}: '
                                           f'{resp.data[:400].decode(errors="replace")}')
                    return resp.status, (json.loads(resp.data) if resp.data else {})

                def get(self, path):
                    return self.call('GET', path)[1]


            def canonical_requirements(requirements):
                out = []
                for req in requirements or []:
                    item = dict(req)
                    if isinstance(item.get('values'), list):
                        item['values'] = sorted(item['values'])
                    out.append(json.dumps(item, sort_keys=True))
                return sorted(out)


            def nodepool_state(pool):
                spec = pool['spec']
                return {
                    'requirements': spec['template']['spec'].get('requirements', []),
                    'weight': spec.get('weight'),
                }


            def same_state(a, b):
                return (canonical_requirements(a['requirements']) == canonical_requirements(b['requirements'])
                        and a.get('weight') == b.get('weight'))


            def save_state(state):
                tmp = STATE_FILE + '.new'
                with open(tmp, 'w') as f:
                    json.dump(state, f)
                    f.flush()
                    os.fsync(f.fileno())
                os.replace(tmp, STATE_FILE)


            def load_state():
                if not os.path.exists(STATE_FILE):
                    return None
                with open(STATE_FILE) as f:
                    return json.load(f)
            PYEOF
            python3 -c 'import ast; ast.parse(open("/var/tmp/fis-az-impairment/fisk8s.py").read())'
            echo 'Client library written'

  - name: ValidateEKSAccess
    description: Read-only check that the client can authenticate and has every permission the run needs.
    action: aws:runCommand
    nextStep: SnapshotAndImpair
    isEnd: false
    onFailure: step:CleanupResources
    onCancel: step:CleanupResources
    inputs:
      DocumentName: AWS-RunShellScript
      InstanceIds:
        - '{{ LaunchClientInstance.InstanceId }}'
      CloudWatchOutputConfig:
        CloudWatchOutputEnabled: true
        CloudWatchLogGroupName: /aws/ssm/eks-automode-az-impairment
      Parameters:
        commands:
          - |
            #!/bin/bash
            set -euo pipefail
            export AWS_DEFAULT_REGION='{{ global:REGION }}'
            export CLUSTER_NAME='{{ ClusterName }}'
            export NODEPOOL_NAME='{{ NodePoolName }}'
            export PYTHONPATH=/var/tmp/fis-az-impairment
            python3 - <<'PYEOF'
            import json
            import os
            from fisk8s import Kube, NODEPOOL_PATH

            kube = Kube()
            nodes = kube.get('/api/v1/nodes')['items']
            pool = kube.get(NODEPOOL_PATH + os.environ['NODEPOOL_NAME'])
            checks = [
                {'verb': 'patch', 'resource': 'nodes'},
                {'verb': 'list', 'resource': 'pods'},
                {'verb': 'delete', 'resource': 'pods'},
                {'verb': 'get', 'resource': 'nodepools', 'group': 'karpenter.sh'},
                {'verb': 'patch', 'resource': 'nodepools', 'group': 'karpenter.sh'},
            ]
            results = []
            for attrs in checks:
                _, review = kube.call('POST', '/apis/authorization.k8s.io/v1/selfsubjectaccessreviews', {
                    'apiVersion': 'authorization.k8s.io/v1',
                    'kind': 'SelfSubjectAccessReview',
                    'spec': {'resourceAttributes': attrs},
                })
                results.append({**attrs, 'allowed': review.get('status', {}).get('allowed', False)})
            print(json.dumps({'Cluster': os.environ['CLUSTER_NAME'], 'Nodes': len(nodes),
                              'NodePool': pool['metadata']['name'], 'Authorization': results}, indent=2))
            denied = [r for r in results if not r['allowed']]
            if denied:
                raise SystemExit('Kubernetes authorization denied for: ' + json.dumps(denied)
                                 + '. Check the EKS access entry username and the RBAC binding.')
            PYEOF

  - name: SnapshotAndImpair
    description: 'DISRUPTIVE: record the current state, cordon the target-AZ nodes, patch the NodePool and delete pods.'
    action: aws:runCommand
    nextStep: WaitForDuration
    isEnd: false
    onFailure: step:RestoreNodePool
    onCancel: step:RestoreNodePool
    inputs:
      DocumentName: AWS-RunShellScript
      InstanceIds:
        - '{{ LaunchClientInstance.InstanceId }}'
      CloudWatchOutputConfig:
        CloudWatchOutputEnabled: true
        CloudWatchLogGroupName: /aws/ssm/eks-automode-az-impairment
      Parameters:
        commands:
          - |
            #!/bin/bash
            set -euo pipefail
            export AWS_DEFAULT_REGION='{{ global:REGION }}'
            export CLUSTER_NAME='{{ ClusterName }}'
            export NODEPOOL_NAME='{{ NodePoolName }}'
            export TARGET_AZ='{{ TargetAZ }}'
            export IMPAIR_WEIGHT='{{ ImpairNodePoolWeight }}'
            export PYTHONPATH=/var/tmp/fis-az-impairment
            python3 - <<'PYEOF'
            import copy
            import json
            import os
            from fisk8s import (Kube, NODEPOOL_PATH, SYSTEM_NAMESPACES, ZONE_KEY,
                                load_state, nodepool_state, same_state, save_state)

            AZ = os.environ['TARGET_AZ']
            POOL = os.environ['NODEPOOL_NAME']
            WEIGHT = int(os.environ['IMPAIR_WEIGHT'])
            if load_state() is not None:
                raise SystemExit('A state file already exists on this instance; refusing to overwrite it')

            kube = Kube()
            pool_path = NODEPOOL_PATH + POOL
            az_nodes = kube.get('/api/v1/nodes?labelSelector=' + ZONE_KEY + '%3D' + AZ)['items']
            if not az_nodes:
                raise SystemExit(f'No nodes found in {AZ}; nothing to impair. No changes made.')
            pool = kube.get(pool_path)
            original = nodepool_state(pool)
            reqs = original['requirements']

            # Work out the zone exclusion before changing anything.
            zone = [(i, r) for i, r in enumerate(reqs) if r.get('key') == ZONE_KEY]
            if len(zone) > 1:
                raise SystemExit('NodePool has more than one zone requirement. No changes made.')
            expected = copy.deepcopy(original)
            if zone:
                idx, req = zone[0]
                if req.get('operator') != 'In':
                    raise SystemExit(f"Zone requirement uses operator {req.get('operator')}; only In "
                                     'is supported. No changes made.')
                if AZ not in req.get('values', []):
                    raise SystemExit(f'{AZ} is not in the NodePool zone values. No changes made.')
                remaining = [v for v in req['values'] if v != AZ]
                if not remaining:
                    raise SystemExit(f'{AZ} is the only zone in the NodePool. No changes made.')
                patch = [
                    {'op': 'test', 'path': f'/spec/template/spec/requirements/{idx}', 'value': req},
                    {'op': 'replace', 'path': f'/spec/template/spec/requirements/{idx}/values', 'value': remaining},
                ]
                expected['requirements'][idx]['values'] = remaining
            else:
                subnets = kube.session.client('ec2').describe_subnets(
                    SubnetIds=kube.cluster['resourcesVpcConfig']['subnetIds'])['Subnets']
                remaining = sorted({s['AvailabilityZone'] for s in subnets} - {AZ})
                if not remaining:
                    raise SystemExit('The cluster has no subnets outside the target AZ. No changes made.')
                new_req = {'key': ZONE_KEY, 'operator': 'In', 'values': remaining}
                patch = [{'op': 'add', 'path': '/spec/template/spec/requirements/-', 'value': new_req}]
                expected['requirements'].append(new_req)

            if WEIGHT > 0 and WEIGHT != original['weight']:
                if original['weight'] is None:
                    patch.append({'op': 'add', 'path': '/spec/weight', 'value': WEIGHT})
                else:
                    patch.append({'op': 'test', 'path': '/spec/weight', 'value': original['weight']})
                    patch.append({'op': 'replace', 'path': '/spec/weight', 'value': WEIGHT})
                expected['weight'] = WEIGHT

            observed = {n['metadata'].get('labels', {}).get(ZONE_KEY) for n in kube.get('/api/v1/nodes')['items']}
            if not set(remaining) & observed:
                raise SystemExit('No nodes are running in any remaining AZ. No changes made.')

            # Record the state before the first write. Restore relies on it.
            state = {
                'cluster': os.environ['CLUSTER_NAME'], 'targetAZ': AZ, 'nodePool': POOL,
                'original': original, 'expected': expected, 'phase': 'SNAPSHOTTED',
                'nodes': [{'name': n['metadata']['name'], 'uid': n['metadata']['uid'],
                           'wasUnschedulable': bool(n.get('spec', {}).get('unschedulable')),
                           'cordonIntent': False} for n in az_nodes],
            }
            save_state(state)
            print('SNAPSHOT ' + json.dumps(state))

            for node in state['nodes']:
                if node['wasUnschedulable']:
                    print(f"Skipping {node['name']}: already cordoned before the run")
                    continue
                node['cordonIntent'] = True
                state['phase'] = 'CORDON_PENDING'
                save_state(state)
                current = kube.get('/api/v1/nodes/' + node['name'])
                if current['metadata']['uid'] != node['uid']:
                    raise RuntimeError(f"Node {node['name']} was replaced before it could be cordoned")
                kube.call('PATCH', '/api/v1/nodes/' + node['name'], {'spec': {'unschedulable': True}},
                          'application/strategic-merge-patch+json')
            state['phase'] = 'PATCH_PENDING'
            save_state(state)
            kube.call('PATCH', pool_path, patch, 'application/json-patch+json')
            state['phase'] = 'PATCHED'
            save_state(state)

            if not same_state(nodepool_state(kube.get(pool_path)), expected):
                raise RuntimeError('NodePool does not match the expected state after patching; '
                                   'stopping before deleting pods')

            deleted, failed = 0, []
            for node in state['nodes']:
                pods = kube.get('/api/v1/pods?fieldSelector=spec.nodeName%3D' + node['name'])['items']
                for pod in pods:
                    meta = pod['metadata']
                    if meta['namespace'] in SYSTEM_NAMESPACES:
                        continue
                    if any(o.get('kind') == 'DaemonSet' for o in meta.get('ownerReferences', [])):
                        continue
                    try:
                        kube.call('DELETE', f"/api/v1/namespaces/{meta['namespace']}/pods/{meta['name']}"
                                  '?gracePeriodSeconds=0', allowed=(200, 202, 404))
                        deleted += 1
                    except Exception as exc:
                        failed.append(f"{meta['namespace']}/{meta['name']}: {exc}")
            state['phase'] = 'IMPAIRED'
            save_state(state)
            for item in failed:
                print('Pod deletion failed: ' + item)
            print(json.dumps({'Status': 'IMPAIRED', 'TargetAZ': AZ, 'NodePool': POOL,
                              'Cordoned': sum(n['cordonIntent'] for n in state['nodes']),
                              'PodsDeleted': deleted, 'PodDeletionFailures': len(failed)}))
            if failed and not deleted:
                raise RuntimeError('Every pod deletion failed')
            PYEOF

  - name: WaitForDuration
    description: Keep the impairment in place for the requested duration.
    action: aws:sleep
    nextStep: RestoreNodePool
    isEnd: false
    onFailure: step:RestoreNodePool
    onCancel: step:RestoreNodePool
    inputs:
      Duration: '{{ Duration }}'

  - name: RestoreNodePool
    description: Revert only the changes this run made, then continue to cleanup.
    action: aws:runCommand
    nextStep: CleanupResources
    isEnd: false
    onFailure: step:CleanupResources
    onCancel: step:CleanupResources
    inputs:
      DocumentName: AWS-RunShellScript
      InstanceIds:
        - '{{ LaunchClientInstance.InstanceId }}'
      CloudWatchOutputConfig:
        CloudWatchOutputEnabled: true
        CloudWatchLogGroupName: /aws/ssm/eks-automode-az-impairment
      Parameters:
        commands:
          - |
            #!/bin/bash
            set -euo pipefail
            export AWS_DEFAULT_REGION='{{ global:REGION }}'
            export CLUSTER_NAME='{{ ClusterName }}'
            export PYTHONPATH=/var/tmp/fis-az-impairment
            python3 - <<'PYEOF'
            import json
            from fisk8s import (Kube, NODEPOOL_PATH, ZONE_KEY, load_state, nodepool_state,
                                same_state, save_state)

            state = load_state()
            if state is None:
                # SnapshotAndImpair writes the state file before its first change, so a
                # missing file means it made no changes.
                print(json.dumps({'Status': 'NOTHING_TO_RESTORE'}))
                raise SystemExit(0)

            kube = Kube()
            pool_path = NODEPOOL_PATH + state['nodePool']
            original, expected = state['original'], state['expected']
            errors = []

            try:
                pool = kube.get(pool_path)
                current = nodepool_state(pool)
                if same_state(current, original):
                    print('NodePool already matches its original state')
                elif same_state(current, expected):
                    reqs = current['requirements']
                    zone = [(i, r) for i, r in enumerate(reqs) if r.get('key') == ZONE_KEY]
                    original_zone = [r for r in original['requirements'] if r.get('key') == ZONE_KEY]
                    if len(zone) != 1:
                        raise RuntimeError('Unexpected zone requirements on the NodePool')
                    idx, req = zone[0]
                    patch = [{'op': 'test', 'path': f'/spec/template/spec/requirements/{idx}', 'value': req}]
                    if original_zone:
                        patch.append({'op': 'replace', 'path': f'/spec/template/spec/requirements/{idx}',
                                      'value': original_zone[0]})
                    else:
                        patch.append({'op': 'remove', 'path': f'/spec/template/spec/requirements/{idx}'})
                    if current['weight'] != original['weight']:
                        patch.append({'op': 'test', 'path': '/spec/weight', 'value': current['weight']})
                        if original['weight'] is None:
                            patch.append({'op': 'remove', 'path': '/spec/weight'})
                        else:
                            patch.append({'op': 'replace', 'path': '/spec/weight', 'value': original['weight']})
                    kube.call('PATCH', pool_path, patch, 'application/json-patch+json')
                    if not same_state(nodepool_state(kube.get(pool_path)), original):
                        raise RuntimeError('NodePool does not match its original state after restore')
                    print('NodePool restored')
                else:
                    raise RuntimeError('NodePool was changed outside this experiment; it was left as is. '
                                       'Current: ' + json.dumps(current) + ' Original: ' + json.dumps(original))
            except Exception as exc:
                errors.append('NodePool: ' + str(exc))

            uncordoned = 0
            for node in state['nodes']:
                if node['wasUnschedulable'] or not node['cordonIntent']:
                    continue
                try:
                    status, current = kube.call('GET', '/api/v1/nodes/' + node['name'], allowed=(200, 404))
                    if status == 404:
                        print(f"Node {node['name']} no longer exists")
                        continue
                    if current['metadata']['uid'] != node['uid']:
                        print(f"Node {node['name']} was replaced; not changing the new node")
                        continue
                    if current.get('spec', {}).get('unschedulable'):
                        kube.call('PATCH', '/api/v1/nodes/' + node['name'], {'spec': {'unschedulable': None}},
                                  'application/strategic-merge-patch+json')
                        if kube.get('/api/v1/nodes/' + node['name']).get('spec', {}).get('unschedulable'):
                            raise RuntimeError('still cordoned after uncordon')
                        uncordoned += 1
                except Exception as exc:
                    errors.append(f"Node {node['name']}: {exc}")

            if errors:
                # SSM truncates the step failure message, so print the notice first and
                # the long state record after it.
                print('MANUAL RECOVERY REQUIRED: ' + json.dumps(errors))
                print('ORIGINAL STATE ' + json.dumps(state))
                raise SystemExit('MANUAL RECOVERY REQUIRED. The recorded original state is in the step output.')
            state['phase'] = 'RESTORED'
            save_state(state)
            print(json.dumps({'Status': 'RESTORED', 'NodePool': state['nodePool'], 'Uncordoned': uncordoned}))
            PYEOF

  - name: CleanupResources
    description: Remove the ingress rule, the client instance and its security group, found by execution tag.
    action: aws:executeScript
    timeoutSeconds: 600
    isEnd: true
    inputs:
      Runtime: python3.11
      Handler: cleanup
      InputPayload:
        ExecutionId: '{{ automation:EXECUTION_ID }}'
        VpcId: '{{ VpcId }}'
        SubnetId: '{{ SubnetId }}'
        ClusterSecurityGroupId: '{{ ValidateInputs.ClusterSecurityGroupId }}'
      Script: |
        import time

        import boto3
        from botocore.exceptions import ClientError

        TAGS = {'ManagedBy': 'FIS-SSM-Automation', 'FIS-Experiment': 'eks-automode-az-impairment'}


        def cleanup(events, context):
            ec2 = boto3.client('ec2')
            execution_id = events['ExecutionId']
            vpc_id, subnet_id = events['VpcId'], events['SubnetId']
            cluster_sg = events['ClusterSecurityGroupId']
            group_name = 'fis-eks-az-impairment-' + execution_id
            wanted = dict(TAGS, **{'FIS-AutomationExecutionId': execution_id})
            filters = [{'Name': f'tag:{k}', 'Values': [v]} for k, v in wanted.items()]

            def owned(tags):
                tags = {t['Key']: t['Value'] for t in tags or []}
                return all(tags.get(k) == v for k, v in wanted.items())

            def instances():
                pages = ec2.get_paginator('describe_instances').paginate(Filters=filters)
                return [i for p in pages for r in p['Reservations'] for i in r['Instances']
                        if owned(i.get('Tags'))]

            def groups_by_name():
                return ec2.describe_security_groups(Filters=[
                    {'Name': 'group-name', 'Values': [group_name]},
                    {'Name': 'vpc-id', 'Values': [vpc_id]}])['SecurityGroups']

            def rule_present(sg_id):
                if not cluster_sg or not sg_id:
                    return False
                perms = ec2.describe_security_groups(GroupIds=[cluster_sg])['SecurityGroups'][0]['IpPermissions']
                return any(p.get('IpProtocol') == 'tcp' and p.get('FromPort') == 443 and p.get('ToPort') == 443
                           and any(pair.get('GroupId') == sg_id for pair in p.get('UserIdGroupPairs', []))
                           for p in perms)

            # Fail closed on anything this run cannot prove it owns.
            named = groups_by_name()
            unowned = [g['GroupId'] for g in named if not owned(g.get('Tags'))]
            if unowned or len(named) > 1:
                raise RuntimeError(f'Security groups named {group_name} that this run cannot verify it owns: '
                                   f'{[g["GroupId"] for g in named]}. Manual cleanup required.')
            sg_id = named[0]['GroupId'] if named else None
            owned_instances = instances()
            if len(owned_instances) > 1:
                raise RuntimeError('More than one instance carries this execution tag: '
                                   f'{[i["InstanceId"] for i in owned_instances]}. Manual cleanup required.')
            for inst in owned_instances:
                if inst['State']['Name'] == 'terminated':
                    continue
                if inst.get('VpcId') != vpc_id or inst.get('SubnetId') != subnet_id:
                    raise RuntimeError(f"Instance {inst['InstanceId']} is not in {vpc_id}/{subnet_id}; "
                                       'refusing to terminate it')

            errors = []
            if sg_id and cluster_sg:
                try:
                    ec2.revoke_security_group_ingress(GroupId=cluster_sg, IpPermissions=[{
                        'IpProtocol': 'tcp', 'FromPort': 443, 'ToPort': 443,
                        'UserIdGroupPairs': [{'GroupId': sg_id}]}])
                except ClientError as exc:
                    if exc.response['Error']['Code'] != 'InvalidPermission.NotFound':
                        errors.append(f'Revoking the ingress rule failed: {exc}')

            instance_ids = [i['InstanceId'] for i in owned_instances]
            live = [i['InstanceId'] for i in owned_instances
                    if i['State']['Name'] not in ('terminated', 'shutting-down')]
            if live:
                try:
                    ec2.terminate_instances(InstanceIds=live)
                except ClientError as exc:
                    errors.append(f'Terminating {live} failed: {exc}')
            if instance_ids:
                try:
                    ec2.get_waiter('instance_terminated').wait(
                        InstanceIds=instance_ids, WaiterConfig={'Delay': 5, 'MaxAttempts': 60})
                except Exception as exc:
                    errors.append(f'Termination of {instance_ids} not confirmed: {exc}')

            if sg_id:
                for attempt in range(20):
                    try:
                        ec2.delete_security_group(GroupId=sg_id)
                        break
                    except ClientError as exc:
                        code = exc.response['Error']['Code']
                        if code == 'InvalidGroup.NotFound':
                            break
                        if code == 'DependencyViolation' and attempt < 19:
                            time.sleep(5)
                            continue
                        errors.append(f'Deleting {sg_id} failed: {exc}')
                        break

            remaining = {
                'ingressRule': rule_present(sg_id),
                'instances': [i['InstanceId'] for i in instances() if i['State']['Name'] != 'terminated'],
                'securityGroups': [g['GroupId'] for g in groups_by_name()],
            }
            if errors or remaining['ingressRule'] or remaining['instances'] or remaining['securityGroups']:
                raise RuntimeError(f'Cleanup incomplete: errors={errors} remaining={remaining}')
            return {'Status': 'CLEANED', 'InstanceIds': instance_ids, 'SecurityGroupId': sg_id}
