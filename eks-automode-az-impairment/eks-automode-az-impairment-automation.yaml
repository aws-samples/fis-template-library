schemaVersion: '0.3'
description: |
  Cordon EKS Auto Mode nodes in a target AZ and patch the NodePool to exclude
  that AZ from scheduling. Waits for the specified duration, then restores the
  original NodePool configuration and uncordons nodes. Handles cleanup on cancel
  or failure.

  The Kubernetes API calls run from an ephemeral EC2 instance launched INSIDE
  the target VPC/subnet (via aws:runInstances + aws:runCommand), NOT from the
  SSM-managed aws:executeScript sandbox. This lets the automation reach a
  cluster whose Kubernetes API endpoint is private (or public with a restrictive
  publicAccessCidrs allowlist), because the traffic originates from inside the
  VPC and is subject to your security groups and the EKS private endpoint rather
  than requiring public endpoint access. The instance is created, used, and
  terminated within the experiment, and the temporary security group is removed
  on completion, failure, or cancel.
assumeRole: '{{ AutomationAssumeRole }}'
parameters:
  AutomationAssumeRole:
    type: String
    description: IAM role for automation execution
    default: ''
  ClusterName:
    type: String
    description: Name of the EKS cluster
  TargetAZ:
    type: String
    description: Availability Zone to impair (e.g. ap-southeast-2a)
  NodePoolName:
    type: String
    description: >-
      Name of a custom EKS Auto Mode NodePool to patch. Must NOT be a built-in
      pool (general-purpose or system): AWS reconciles those back to their
      managed configuration, so the AZ exclusion is silently reverted
      mid-experiment while the experiment still reports success.
    default: ''
  Duration:
    type: String
    description: Duration of the impairment in ISO 8601 format
    default: 'PT15M'
  SubnetId:
    type: String
    description: >-
      Subnet ID in which to launch the ephemeral K8s client instance. MUST be a
      subnet that can reach the cluster's Kubernetes API endpoint: the cluster
      has private endpoint access enabled and the cluster security group allows
      TCP 443 from this subnet's CIDR (the client gets a new security group on
      every run). The subnet also needs outbound internet access, for example
      through a NAT gateway: the client installs packages from the internet and
      calls the EKS, EC2 and CloudWatch Logs APIs, so the ssm, ssmmessages and
      ec2messages interface endpoints alone are not enough. Do NOT use a subnet
      in the target AZ being impaired, or the network disruption will also
      sever the client instance.
  VpcId:
    type: String
    description: VPC ID in which the temporary security group is created
  InstanceProfileName:
    type: String
    description: >-
      Name of an existing EC2 instance profile whose role has the
      AmazonSSMManagedInstanceCore managed policy (so the ephemeral instance can
      register with SSM and receive the runCommand), the inline policy from
      eks-automode-az-impairment-instance-profile-iam-policy.json, and an EKS
      access entry bound by the RBAC manifest, because the Kubernetes calls run
      under this role.
    default: 'SSM-Managed-Instance-Profile'
  InstanceType:
    type: String
    description: EC2 instance type for the ephemeral K8s client
    default: 't3.small'
  LatestAmiId:
    type: String
    description: Amazon Linux 2023 AMI ID (resolved from SSM Parameter Store)
    default: '{{ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
mainSteps:
  - name: ValidateInputs
    description: Validate inputs and the NodePool choice before creating any resources
    action: aws:executeScript
    nextStep: CreateSecurityGroup
    isEnd: false
    inputs:
      Runtime: python3.11
      Handler: validate_inputs
      Script: |
        import re

        def validate_inputs(events, context):
            cluster_name = events['ClusterName']
            target_az = events['TargetAZ']
            node_pool_name = events['NodePoolName']

            if not re.match(r'^[a-z]{2}-[a-z]+-\d[a-z]$', target_az):
                raise ValueError(f"Invalid AZ format: {target_az}")
            if not cluster_name:
                raise ValueError("Cluster name cannot be empty")
            if not node_pool_name:
                raise ValueError("NodePool name cannot be empty")

            # The built-in Auto Mode NodePools are managed by AWS and cannot be
            # modified: EKS reconciles them back to their managed config, which
            # silently ends the impairment early while the experiment still
            # reports success. Fail loudly instead.
            if node_pool_name in ('general-purpose', 'system'):
                raise ValueError(
                    f"'{node_pool_name}' is a built-in EKS Auto Mode NodePool and cannot be "
                    "modified. EKS reverts changes to it mid-experiment, silently ending the "
                    "AZ exclusion. Specify a custom NodePool instead.")

            return {'Status': 'VALID'}
      InputPayload:
        ClusterName: '{{ ClusterName }}'
        TargetAZ: '{{ TargetAZ }}'
        NodePoolName: '{{ NodePoolName }}'

  - name: CreateSecurityGroup
    description: Create a temporary egress-only security group for the ephemeral client instance
    action: 'aws:executeAwsApi'
    onFailure: 'Abort'
    onCancel: 'Abort'
    nextStep: LaunchClientInstance
    isEnd: false
    inputs:
      Service: ec2
      Api: CreateSecurityGroup
      GroupName: 'FIS-EKS-AZImpair-Client-{{ automation:EXECUTION_ID }}'
      Description: 'Temporary SG for FIS EKS Auto Mode AZ impairment client instance'
      VpcId: '{{ VpcId }}'
      TagSpecifications:
        - ResourceType: 'security-group'
          Tags:
            - Key: 'Name'
              Value: 'FIS-EKS-AZImpair-Client'
            - Key: 'FIS-Experiment'
              Value: 'EKSAutoModeAZImpairment'
            - Key: 'AutoCleanup'
              Value: 'true'
            - Key: 'ManagedBy'
              Value: 'FIS-SSM-Automation'
    outputs:
      - Name: SecurityGroupId
        Selector: '$.GroupId'
        Type: String

  - name: LaunchClientInstance
    description: Launch the ephemeral K8s client instance inside the target VPC/subnet
    action: 'aws:runInstances'
    onFailure: 'step:DeleteSecurityGroup'
    onCancel: 'step:TerminateInstance'
    nextStep: WaitForSSMAgent
    isEnd: false
    inputs:
      ImageId: '{{ LatestAmiId }}'
      InstanceType: '{{ InstanceType }}'
      MinInstanceCount: 1
      MaxInstanceCount: 1
      SubnetId: '{{ SubnetId }}'
      SecurityGroupIds:
        - '{{ CreateSecurityGroup.SecurityGroupId }}'
      IamInstanceProfileName: '{{ InstanceProfileName }}'
      MetadataOptions:
        HttpTokens: 'required'
      TagSpecifications:
        - ResourceType: 'instance'
          Tags:
            - Key: 'Name'
              Value: 'FIS-EKS-AZImpair-Client'
            - Key: 'FIS-Experiment'
              Value: 'EKSAutoModeAZImpairment'
            - Key: 'AutoCleanup'
              Value: 'true'
            - Key: 'ManagedBy'
              Value: 'FIS-SSM-Automation'
    outputs:
      - Name: InstanceId
        Selector: '$.InstanceIds[0]'
        Type: String

  - name: WaitForSSMAgent
    description: Wait for the SSM Agent on the ephemeral instance to report online
    action: 'aws:waitForAwsResourceProperty'
    timeoutSeconds: 600
    onFailure: 'step:TerminateInstance'
    onCancel: 'step:TerminateInstance'
    nextStep: BootstrapClient
    isEnd: false
    inputs:
      Service: ssm
      Api: DescribeInstanceInformation
      InstanceInformationFilterList:
        - key: InstanceIds
          valueSet:
            - '{{ LaunchClientInstance.InstanceId }}'
      PropertySelector: '$.InstanceInformationList[0].PingStatus'
      DesiredValues:
        - Online

  - name: BootstrapClient
    description: Install Python 3 and dependencies on the ephemeral instance
    action: 'aws:runCommand'
    onFailure: 'step:TerminateInstance'
    onCancel: 'step:TerminateInstance'
    nextStep: CordonPatchDelete
    isEnd: false
    inputs:
      DocumentName: 'AWS-RunShellScript'
      InstanceIds:
        - '{{ LaunchClientInstance.InstanceId }}'
      Parameters:
        commands:
          - |
            #!/bin/bash
            set -euo pipefail
            dnf install -y python3 python3-pip >/dev/null 2>&1 || yum install -y python3 python3-pip >/dev/null 2>&1
            python3 -m pip install --quiet urllib3 botocore boto3 2>/dev/null || true
            echo "bootstrap-complete"

  - name: CordonPatchDelete
    description: >-
      Run the impairment on the in-VPC instance: fetch cluster endpoint/CA,
      cordon nodes in the target AZ, patch the NodePool to exclude the AZ, and
      delete pods in the AZ. Writes the patch result to a file on the instance so
      the restore step can gate on it. On failure/cancel, routes to restore.
    action: 'aws:runCommand'
    onFailure: 'step:RestoreNodePool'
    onCancel: 'step:RestoreNodePool'
    nextStep: WaitForDuration
    isEnd: false
    inputs:
      DocumentName: 'AWS-RunShellScript'
      InstanceIds:
        - '{{ LaunchClientInstance.InstanceId }}'
      CloudWatchOutputConfig:
        CloudWatchOutputEnabled: true
      Parameters:
        commands:
          - |
            #!/bin/bash
            set -uo pipefail
            export CLUSTER_NAME='{{ ClusterName }}'
            export TARGET_AZ='{{ TargetAZ }}'
            export NODE_POOL_NAME='{{ NodePoolName }}'
            export AWS_DEFAULT_REGION='{{ global:REGION }}'
            cat > /tmp/eks_impair.py <<'PYEOF'
            import os
            import sys
            import json
            import base64
            import tempfile
            import urllib3
            import boto3


            def get_token(cluster_name):
                session = boto3.Session()
                from botocore.signers import RequestSigner
                from botocore.model import ServiceId

                service_id = ServiceId('sts')
                signer = RequestSigner(service_id, session.region_name, 'sts', 'v4',
                                       session.get_credentials(), session.events)
                params = {
                    'method': 'GET',
                    'url': f'https://sts.{session.region_name}.amazonaws.com/?Action=GetCallerIdentity&Version=2011-06-15',
                    'body': {},
                    'headers': {'x-k8s-aws-id': cluster_name},
                    'context': {}
                }
                signed_url = signer.generate_presigned_url(
                    params, region_name=session.region_name,
                    expires_in=60, operation_name='')
                return 'k8s-aws-v1.' + base64.urlsafe_b64encode(
                    signed_url.encode('utf-8')).decode('utf-8').rstrip('=')


            def get_cluster(cluster_name):
                eks = boto3.client('eks')
                resp = eks.describe_cluster(name=cluster_name)
                cluster = resp['cluster']
                if cluster['status'] != 'ACTIVE':
                    raise ValueError(f"Cluster is not ACTIVE: {cluster['status']}")
                return cluster['endpoint'], cluster['certificateAuthority']['data']


            def cordon_nodes(http, endpoint, token, target_az):
                resp = http.request('GET',
                    f"{endpoint}/api/v1/nodes?labelSelector=topology.kubernetes.io/zone={target_az}",
                    headers={'Authorization': f'Bearer {token}', 'Accept': 'application/json'})
                if resp.status != 200:
                    raise RuntimeError(f"Failed to list nodes: {resp.status} {resp.data.decode()}")
                nodes_data = json.loads(resp.data.decode())
                nodes = [n['metadata']['name'] for n in nodes_data.get('items', [])]
                cordoned = []
                for node in nodes:
                    patch_body = {'spec': {'unschedulable': True}}
                    r = http.request('PATCH', f"{endpoint}/api/v1/nodes/{node}",
                        headers={'Authorization': f'Bearer {token}',
                                 'Content-Type': 'application/strategic-merge-patch+json',
                                 'Accept': 'application/json'},
                        body=json.dumps(patch_body).encode('utf-8'))
                    if r.status == 200:
                        cordoned.append(node)
                    else:
                        print(f"Warning: Failed to cordon {node}: {r.status}")
                print(json.dumps({'Status': 'NODES_CORDONED' if nodes else 'NO_NODES_FOUND',
                                  'CordonedNodes': cordoned, 'TotalNodes': len(nodes)}))


            def patch_nodepool(http, endpoint, token, cluster_name, target_az, node_pool_name):
                nodepool_path = None
                resp = None
                for api_group in ['eks.amazonaws.com', 'karpenter.sh']:
                    path = f'/apis/{api_group}/v1/nodepools/{node_pool_name}'
                    resp = http.request('GET', f"{endpoint}{path}",
                        headers={'Authorization': f'Bearer {token}', 'Accept': 'application/json'})
                    if resp.status == 200:
                        nodepool_path = path
                        break
                if not nodepool_path:
                    raise RuntimeError(
                        f"NodePool {node_pool_name} not found in eks.amazonaws.com or karpenter.sh API groups")

                current_nodepool = json.loads(resp.data.decode())
                requirements = current_nodepool.get('spec', {}).get('template', {}).get('spec', {}).get('requirements', [])

                zone_req_index = None
                original_zone_values = []
                for i, req in enumerate(requirements):
                    if req.get('key') == 'topology.kubernetes.io/zone':
                        zone_req_index = i
                        original_zone_values = req.get('values', [])
                        break

                if zone_req_index is not None:
                    new_values = [z for z in original_zone_values if z != target_az]
                    if not new_values:
                        raise ValueError(f"Cannot remove last AZ. {target_az} is the only zone.")
                    patch = [{'op': 'replace',
                              'path': f'/spec/template/spec/requirements/{zone_req_index}/values',
                              'value': new_values}]
                else:
                    eks = boto3.client('eks')
                    ec2 = boto3.client('ec2')
                    cluster_resp = eks.describe_cluster(name=cluster_name)
                    subnet_ids = cluster_resp['cluster']['resourcesVpcConfig']['subnetIds']
                    subnet_resp = ec2.describe_subnets(SubnetIds=subnet_ids)
                    all_azs = list(set(s['AvailabilityZone'] for s in subnet_resp['Subnets']))
                    new_values = [z for z in all_azs if z and z != target_az]
                    if not new_values:
                        raise ValueError(f"No other AZs available. Found: {all_azs}")
                    new_req = {'key': 'topology.kubernetes.io/zone', 'operator': 'In', 'values': new_values}
                    patch = [{'op': 'add', 'path': '/spec/template/spec/requirements/-', 'value': new_req}]

                r = http.request('PATCH', f"{endpoint}{nodepool_path}",
                    headers={'Authorization': f'Bearer {token}',
                             'Content-Type': 'application/json-patch+json',
                             'Accept': 'application/json'},
                    body=json.dumps(patch).encode('utf-8'))
                if r.status != 200:
                    raise RuntimeError(f"Failed to patch NodePool: {r.status} {r.data.decode()[:500]}")

                return {
                    'Status': 'NODEPOOL_PATCHED',
                    'NodePoolName': node_pool_name,
                    'ExcludedAZ': target_az,
                    'RemainingAZs': new_values,
                    'ZoneReqExisted': zone_req_index is not None,
                    'OriginalZoneValues': original_zone_values
                }


            def delete_pods(http, endpoint, token, target_az):
                resp = http.request('GET',
                    f"{endpoint}/api/v1/nodes?labelSelector=topology.kubernetes.io/zone={target_az}",
                    headers={'Authorization': f'Bearer {token}', 'Accept': 'application/json'})
                if resp.status != 200:
                    print(json.dumps({'Status': 'FAILED_TO_LIST_NODES', 'Error': resp.data.decode()[:200]}))
                    return
                nodes_data = json.loads(resp.data.decode())
                node_names = [n['metadata']['name'] for n in nodes_data.get('items', [])]
                if not node_names:
                    print(json.dumps({'Status': 'NO_NODES_IN_AZ', 'DeletedPods': 0}))
                    return
                deleted_pods = []
                for node_name in node_names:
                    resp = http.request('GET',
                        f"{endpoint}/api/v1/pods?fieldSelector=spec.nodeName={node_name}",
                        headers={'Authorization': f'Bearer {token}', 'Accept': 'application/json'})
                    if resp.status != 200:
                        continue
                    pods_data = json.loads(resp.data.decode())
                    for pod in pods_data.get('items', []):
                        ns = pod['metadata']['namespace']
                        name = pod['metadata']['name']
                        if ns in ['kube-system', 'kube-node-lease', 'kube-public']:
                            continue
                        del_resp = http.request('DELETE',
                            f"{endpoint}/api/v1/namespaces/{ns}/pods/{name}?gracePeriodSeconds=0",
                            headers={'Authorization': f'Bearer {token}', 'Accept': 'application/json'})
                        if del_resp.status in [200, 202]:
                            deleted_pods.append(f"{ns}/{name}")
                        else:
                            print(f"Warning: Failed to delete {ns}/{name}: {del_resp.status}")
                print(json.dumps({'Status': 'PODS_DELETED', 'TargetAZ': target_az,
                                  'DeletedPods': len(deleted_pods), 'PodNames': deleted_pods[:20]}))


            def main():
                cluster_name = os.environ['CLUSTER_NAME']
                target_az = os.environ['TARGET_AZ']
                node_pool_name = os.environ['NODE_POOL_NAME']

                endpoint, ca_data = get_cluster(cluster_name)

                ca_file = tempfile.NamedTemporaryFile(delete=False, suffix='.crt')
                ca_file.write(base64.b64decode(ca_data))
                ca_file.close()
                try:
                    token = get_token(cluster_name)
                    # Bounded waits: an unreachable endpoint address fails in seconds, not minutes, so the
                    # client moves on to the next address and an unreachable API fails the step quickly.
                    http = urllib3.PoolManager(cert_reqs='CERT_REQUIRED', ca_certs=ca_file.name,
                                               timeout=urllib3.Timeout(connect=5.0, read=30.0),
                                               retries=urllib3.Retry(total=3, connect=3, read=1, backoff_factor=1))

                    cordon_nodes(http, endpoint, token, target_az)
                    patch_result = patch_nodepool(http, endpoint, token, cluster_name, target_az, node_pool_name)
                    # Persist the patch result so the restore step can gate on it
                    # exactly like the original executeScript version did.
                    with open('/tmp/eks_patch_result.json', 'w') as f:
                        json.dump(patch_result, f)
                    print(json.dumps(patch_result))
                    delete_pods(http, endpoint, token, target_az)
                finally:
                    if os.path.exists(ca_file.name):
                        os.unlink(ca_file.name)


            if __name__ == '__main__':
                main()
            PYEOF
            python3 /tmp/eks_impair.py
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "CordonPatchDelete failed with rc=$rc" >&2
              exit $rc
            fi

  - name: WaitForDuration
    description: Wait for the specified impairment duration
    action: aws:sleep
    onFailure: 'step:RestoreNodePool'
    onCancel: 'step:RestoreNodePool'
    nextStep: RestoreNodePool
    isEnd: false
    inputs:
      Duration: '{{ Duration }}'

  - name: RestoreNodePool
    description: >-
      Restore NodePool config and uncordon nodes on the in-VPC instance.
      Idempotent and safe on failure/cancel. Gates the NodePool restore on the
      recorded patch result (/tmp/eks_patch_result.json); raises on a terminal
      restore failure so the step ends Failed.
    action: 'aws:runCommand'
    onFailure: 'step:TerminateInstance'
    onCancel: 'step:TerminateInstance'
    nextStep: TerminateInstance
    isEnd: false
    inputs:
      DocumentName: 'AWS-RunShellScript'
      InstanceIds:
        - '{{ LaunchClientInstance.InstanceId }}'
      CloudWatchOutputConfig:
        CloudWatchOutputEnabled: true
      Parameters:
        commands:
          - |
            #!/bin/bash
            set -uo pipefail
            export CLUSTER_NAME='{{ ClusterName }}'
            export TARGET_AZ='{{ TargetAZ }}'
            export NODE_POOL_NAME='{{ NodePoolName }}'
            export AWS_DEFAULT_REGION='{{ global:REGION }}'
            cat > /tmp/eks_restore.py <<'PYEOF'
            import os
            import json
            import base64
            import tempfile
            import urllib3
            import boto3


            def get_token(cluster_name):
                session = boto3.Session()
                from botocore.signers import RequestSigner
                from botocore.model import ServiceId

                service_id = ServiceId('sts')
                signer = RequestSigner(service_id, session.region_name, 'sts', 'v4',
                                       session.get_credentials(), session.events)
                params = {
                    'method': 'GET',
                    'url': f'https://sts.{session.region_name}.amazonaws.com/?Action=GetCallerIdentity&Version=2011-06-15',
                    'body': {},
                    'headers': {'x-k8s-aws-id': cluster_name},
                    'context': {}
                }
                signed_url = signer.generate_presigned_url(
                    params, region_name=session.region_name,
                    expires_in=60, operation_name='')
                return 'k8s-aws-v1.' + base64.urlsafe_b64encode(
                    signed_url.encode('utf-8')).decode('utf-8').rstrip('=')


            def restore_nodepool():
                cluster_name = os.environ['CLUSTER_NAME']
                target_az = os.environ['TARGET_AZ']
                node_pool_name = os.environ['NODE_POOL_NAME']

                eks = boto3.client('eks')
                response = eks.describe_cluster(name=cluster_name)
                cluster = response['cluster']
                endpoint = cluster['endpoint']
                ca_data = cluster['certificateAuthority']['data']

                # Load the patch result recorded by the impair phase. If it is
                # missing, the patch step never ran (or did not complete), so we
                # must not touch the NodePool.
                try:
                    with open('/tmp/eks_patch_result.json') as f:
                        patch_result = json.load(f)
                except (IOError, ValueError):
                    patch_result = {}

                ca_file = tempfile.NamedTemporaryFile(delete=False, suffix='.crt')
                ca_file.write(base64.b64decode(ca_data))
                ca_file.close()

                try:
                    token = get_token(cluster_name)
                    # Bounded waits: an unreachable endpoint address fails in seconds, not minutes, so the
                    # client moves on to the next address and an unreachable API fails the step quickly.
                    http = urllib3.PoolManager(cert_reqs='CERT_REQUIRED', ca_certs=ca_file.name,
                                               timeout=urllib3.Timeout(connect=5.0, read=30.0),
                                               retries=urllib3.Retry(total=3, connect=3, read=1, backoff_factor=1))
                except Exception:
                    if os.path.exists(ca_file.name):
                        os.unlink(ca_file.name)
                    raise

                restore_status = 'UNKNOWN'

                # --- Restore NodePool ---
                try:
                    # Only touch the NodePool if the patch phase confirmed it
                    # changed it. Without that confirmation we cannot distinguish
                    # a zone requirement we added from one that was already part
                    # of the customer's NodePool, and removing theirs would be
                    # destructive.
                    if patch_result.get('Status') != 'NODEPOOL_PATCHED':
                        restore_status = 'NODEPOOL_UNCHANGED_NO_PATCH_RECORDED'
                    else:
                        nodepool_path = None
                        resp = None
                        for api_group in ['eks.amazonaws.com', 'karpenter.sh']:
                            path = f'/apis/{api_group}/v1/nodepools/{node_pool_name}'
                            resp = http.request('GET', f"{endpoint}{path}",
                                headers={'Authorization': f'Bearer {token}', 'Accept': 'application/json'})
                            if resp.status == 200:
                                nodepool_path = path
                                break

                        if nodepool_path:
                            current_nodepool = json.loads(resp.data.decode())
                            requirements = current_nodepool.get('spec', {}).get('template', {}).get('spec', {}).get('requirements', [])

                            zone_req_existed = patch_result.get('ZoneReqExisted', False)
                            original_zone_values = patch_result.get('OriginalZoneValues', [])

                            if zone_req_existed and original_zone_values:
                                restore_status = 'NODEPOOL_ALREADY_CORRECT'
                                for i, req in enumerate(requirements):
                                    if req.get('key') == 'topology.kubernetes.io/zone':
                                        if sorted(req.get('values', [])) == sorted(original_zone_values):
                                            break
                                        patch = [{'op': 'replace',
                                                  'path': f'/spec/template/spec/requirements/{i}/values',
                                                  'value': original_zone_values}]
                                        r = http.request('PATCH', f"{endpoint}{nodepool_path}",
                                            headers={'Authorization': f'Bearer {token}',
                                                     'Content-Type': 'application/json-patch+json',
                                                     'Accept': 'application/json'},
                                            body=json.dumps(patch).encode('utf-8'))
                                        restore_status = ('NODEPOOL_RESTORED' if r.status == 200
                                                          else f'NODEPOOL_RESTORE_FAILED_{r.status}')
                                        break
                            else:
                                expected = patch_result.get('RemainingAZs', [])
                                restore_status = 'NODEPOOL_ALREADY_CORRECT'
                                for i, req in enumerate(requirements):
                                    if req.get('key') == 'topology.kubernetes.io/zone':
                                        if expected and sorted(req.get('values', [])) != sorted(expected):
                                            restore_status = 'NODEPOOL_MODIFIED_EXTERNALLY_SKIPPED'
                                            break
                                        patch = [{'op': 'remove',
                                                  'path': f'/spec/template/spec/requirements/{i}'}]
                                        r = http.request('PATCH', f"{endpoint}{nodepool_path}",
                                            headers={'Authorization': f'Bearer {token}',
                                                     'Content-Type': 'application/json-patch+json',
                                                     'Accept': 'application/json'},
                                            body=json.dumps(patch).encode('utf-8'))
                                        restore_status = ('NODEPOOL_RESTORED' if r.status == 200
                                                          else f'NODEPOOL_RESTORE_FAILED_{r.status}')
                                        break
                        else:
                            restore_status = 'NODEPOOL_NOT_FOUND'

                except Exception as e:
                    restore_status = f'NODEPOOL_RESTORE_ERROR: {str(e)}'

                # --- Uncordon nodes ---
                uncordoned = []
                uncordon_failed = False
                try:
                    resp = http.request('GET',
                        f"{endpoint}/api/v1/nodes?labelSelector=topology.kubernetes.io/zone={target_az}",
                        headers={'Authorization': f'Bearer {token}', 'Accept': 'application/json'})
                    if resp.status == 200:
                        nodes_data = json.loads(resp.data.decode())
                        for node in nodes_data.get('items', []):
                            node_name = node['metadata']['name']
                            if node.get('spec', {}).get('unschedulable'):
                                patch_body = {'spec': {'unschedulable': None}}
                                patch_resp = http.request('PATCH', f"{endpoint}/api/v1/nodes/{node_name}",
                                    headers={'Authorization': f'Bearer {token}',
                                             'Content-Type': 'application/strategic-merge-patch+json',
                                             'Accept': 'application/json'},
                                    body=json.dumps(patch_body).encode('utf-8'))
                                if patch_resp.status == 200:
                                    uncordoned.append(node_name)
                                else:
                                    uncordon_failed = True
                                    print(f"Warning: Failed to uncordon {node_name}: {patch_resp.status}")
                    else:
                        uncordon_failed = True
                        restore_status += f' | UNCORDON_LIST_FAILED_{resp.status}'
                except Exception as e:
                    uncordon_failed = True
                    restore_status += f' | UNCORDON_ERROR: {str(e)}'
                finally:
                    if os.path.exists(ca_file.name):
                        os.unlink(ca_file.name)

                result = json.dumps({
                    'Status': restore_status,
                    'UncordonedNodes': uncordoned,
                    'NodePoolName': node_pool_name,
                    'RestoredAZ': target_az
                })
                print(f"RestoreResult: {result}")

                # A terminal restore failure means cleanup was ATTEMPTED and did
                # not work: the AZ is still excluded from the NodePool and/or
                # nodes are still cordoned. Exit non-zero so the SSM step ends
                # Failed and an operator's stop-condition or CloudWatch alarm can
                # trip, instead of silently reporting success.
                terminal = (
                    restore_status.startswith('NODEPOOL_RESTORE_FAILED_')
                    or restore_status.startswith('NODEPOOL_RESTORE_ERROR')
                    or 'UNCORDON_ERROR' in restore_status
                    or 'UNCORDON_LIST_FAILED' in restore_status
                    or uncordon_failed
                )
                if terminal:
                    print(f"ERROR: Restore did not complete cleanly, manual remediation required. {result}")
                    return 1

                # NODEPOOL_MODIFIED_EXTERNALLY_SKIPPED is NOT a failure: the
                # automation deliberately declined to touch a NodePool that was
                # changed by something else (EKS Auto Mode reconciliation, a
                # GitOps controller, or an operator) after we patched it, because
                # removing a requirement we no longer recognise could be
                # destructive. That external change has often already reverted our
                # exclusion, so failing here would be a false alarm. Surface it as
                # a WARNING and let the step succeed.
                if restore_status.startswith('NODEPOOL_MODIFIED_EXTERNALLY_SKIPPED'):
                    print(f"WARNING: {restore_status} — NodePool changed externally "
                          "after we patched it; automation left it untouched. Verify "
                          "the NodePool's topology.kubernetes.io/zone requirement "
                          "manually.")
                return 0


            if __name__ == '__main__':
                import sys
                sys.exit(restore_nodepool())
            PYEOF
            python3 /tmp/eks_restore.py
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "RestoreNodePool reported terminal failure rc=$rc" >&2
              exit $rc
            fi

  - name: TerminateInstance
    description: Terminate the ephemeral client instance (runs on success, failure, and cancel)
    action: 'aws:changeInstanceState'
    onFailure: 'step:DeleteSecurityGroup'
    onCancel: 'step:DeleteSecurityGroup'
    nextStep: DeleteSecurityGroup
    isEnd: false
    inputs:
      InstanceIds:
        - '{{ LaunchClientInstance.InstanceId }}'
      DesiredState: terminated
      Force: true

  - name: DeleteSecurityGroup
    description: Delete the temporary security group (runs after the instance is terminated)
    action: 'aws:executeAwsApi'
    isEnd: true
    inputs:
      Service: ec2
      Api: DeleteSecurityGroup
      GroupId: '{{ CreateSecurityGroup.SecurityGroupId }}'
outputs:
  - RestoreNodePool.CommandId
